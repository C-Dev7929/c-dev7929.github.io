					lessons: ['Bài 25: Làm quen với Học máy', 'Bài 26: Làm quen với Khoa học dữ liệu',
						'Bài 27: Máy tính & Khoa học dữ liệu', 'Bài 29: Mô phỏng trong giải quyết vấn đề',
						'Bài 30: Ứng dụng mô phỏng trong giáo dục'
					] },
			],
		};

		const SUBJECT_INFO = {
			toan: { name: 'Toán 12', emoji: '📐', tip: 'Tập trung đọc định lý, ghi công thức và xem ví dụ mẫu!',
				color: '#FF6B8A' },
			ly: { name: 'Vật Lý 12', emoji: '⚡', tip: 'Ghi nhớ công thức và điều kiện áp dụng của từng định luật!',
				color: '#4DA8B8' },
			tin: { name: 'Tin Học 12', emoji: '💻', tip: 'Đọc kỹ khái niệm, thử mô phỏng cú pháp HTML/CSS!',
			color: '#A78BFA' },
		};

		// ─── STATE ────────────────────────────────────────────────────────────────────
		const state = {
			subject: 'toan',
			running: false,
			totalSecs: 120 * 60,
			remainSecs: 120 * 60,
			interval: null,
			noteTab: 'toan',
			notes: { toan: [], ly: [], tin: [] },
			sessions: { toan: 0, ly: 0, tin: 0 },
			completedLessons: { toan: {}, ly: {}, tin: {} },
			examDate: '2026-06-26',
			darkMode: false,
			detailTab: 'toan',
			expandedChapters: {},
			editingIdx: null,
		};

		// ─── STORAGE ──────────────────────────────────────────────────────────────────
		function loadAll() {
			try {
				const raw = localStorage.getItem('studyplanner_v2');
				if (raw) {
					const d = JSON.parse(raw);
					if (d.notes) state.notes = d.notes;
					if (d.sessions) state.sessions = d.sessions;
					if (d.completedLessons) state.completedLessons = d.completedLessons;
					if (d.examDate) state.examDate = d.examDate;
					if (d.darkMode !== undefined) state.darkMode = d.darkMode;
					if (d.endTime) {
						state.endTime = d.endTime;
						const remain = Math.floor((state.endTime - Date.now()) / 1000);
						if (remain > 0) {
							state.remainSecs = remain;
							startTimer();
						}
					}
				}
			} catch (e) { /* fresh start */ }
			applyDarkMode();
			document.getElementById('exam-date-input').value = state.examDate;
			updateCountdown();
			renderDetailTab();
			renderSavedNotes();
			updateProgressBars();
			updateAllLessonProgress();
			selectSubject(state.subject);
		}

		function saveAll() {
			try {
				localStorage.setItem('studyplanner_v2', JSON.stringify({
					notes: state.notes,
					sessions: state.sessions,
					completedLessons: state.completedLessons,
					examDate: state.examDate,
					darkMode: state.darkMode,
					endTime: state.endTime,
				}));
			} catch (e) {}
		}

		// ─── DARK MODE ────────────────────────────────────────────────────────────────
		function applyDarkMode() {
			if (state.darkMode) {
				document.body.classList.add('dark');
				document.getElementById('dark-toggle').textContent = '☀️';
			} else {
				document.body.classList.remove('dark');
				document.getElementById('dark-toggle').textContent = '🌙';
			}
		}

		function toggleDarkMode() {
			state.darkMode = !state.darkMode;
			applyDarkMode();
			saveAll();
		}
		document.getElementById('dark-toggle').addEventListener('click', toggleDarkMode);

		// ─── CLOCK & DATE ─────────────────────────────────────────────────────────────
		function updateClock() {
			const now = new Date();
			document.getElementById('js-date').textContent = now.toLocaleDateString('vi-VN', { weekday: 'long',
				day: 'numeric', month: 'long', year: 'numeric' });
			document.getElementById('js-time').textContent = now.toLocaleTimeString('vi-VN', { hour: '2-digit',
				minute: '2-digit', second: '2-digit' });
		}
		setInterval(updateClock, 1000);
		updateClock();

		// ─── COUNTDOWN ────────────────────────────────────────────────────────────────
		function updateCountdown() {
			const examDate = new Date(state.examDate + 'T07:00:00');
			const now = new Date();
			let diff = examDate - now;
			if (diff < 0) diff = 0;
			const days = Math.floor(diff / (1000 * 60 * 60 * 24));
			const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
			const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
			const secs = Math.floor((diff % (1000 * 60)) / 1000);
			document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
			document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
			document.getElementById('cd-mins').textContent = String(mins).padStart(2, '0');
			document.getElementById('cd-secs').textContent = String(secs).padStart(2, '0');
			document.getElementById('cd-exam-label').textContent = 'Ngày thi: ' + new Date(state.examDate +
				'T07:00:00').toLocaleDateString('vi-VN', { day: 'numeric', month: 'numeric', year: 'numeric' });
		}
		setInterval(updateCountdown, 1000);

		function updateExamDate() {
			const input = document.getElementById('exam-date-input').value;
			if (input) {
				state.examDate = input;
				saveAll();
				updateCountdown();
				showToast('📅', 'Đã cập nhật!', 'Ngày thi đã được lưu lại ✅');
			}
		}

		// ─── SUBJECT SELECTION ────────────────────────────────────────────────────────
		function selectSubject(s) {
			state.subject = s;
			document.querySelectorAll('.subject-card').forEach(c => c.classList.remove('active'));
			const card = document.getElementById('card-' + s);
			if (card) card.classList.add('active');
			const info = SUBJECT_INFO[s];
			const badge = document.getElementById('timer-badge');
			badge.textContent = info.emoji + ' ' + info.name;
			badge.className = 'timer-subject-badge badge-' + s;
			const prog = document.getElementById('ring-prog');
			prog.className = 'ring-prog ' + s;
			const btnStart = document.getElementById('btn-start');
			btnStart.className = 'btn btn-start btn-' + s;
			document.getElementById('timer-tip').innerHTML = '💡 <strong>' + info.name + ':</strong> ' + info.tip;
			switchNoteTab(s);
			switchDetailTab(s);
			if (!state.running) resetTimer(true);
		}

		// ─── DETAIL TABS ──────────────────────────────────────────────────────────────
		function switchDetailTab(s) {
			state.detailTab = s;
			document.querySelectorAll('.detail-tab').forEach(t => {
				t.className = 'detail-tab';
			});
			const dt = document.getElementById('dt-tab-' + s);
			if (dt) dt.className = 'detail-tab active-tab-' + s;
			renderDetailTab();
		}

		function toggleChapter(subject, chIdx) {
			const key = subject + '-' + chIdx;
			state.expandedChapters[key] = !state.expandedChapters[key];
			renderDetailTab();
		}

		function renderDetailTab() {
			const s = state.detailTab;
			const data = LESSON_DATA[s] || [];
			const container = document.getElementById('detail-content');
			let html = '';
			data.forEach((ch, chIdx) => {
				const key = s + '-' + chIdx;
				const isOpen = state.expandedChapters[key] !== false;
				let doneCount = 0;
				ch.lessons.forEach((_, lIdx) => {
					const lKey = chIdx + '-' + lIdx;
					if (state.completedLessons[s] && state.completedLessons[s][lKey]) doneCount++;
				});
				html +=
					`<div class="chapter-group">
			  <div class="chapter-title ${isOpen?'open':''}" onclick="toggleChapter('${s}',${chIdx})">
				<span class="ch-arrow">▶</span> ${ch.ch} 
				<span style="font-size:10px;color:var(--sub);font-weight:500;">(${doneCount}/${ch.lessons.length} hoàn thành)</span>
			  </div>
			  <ul class="lesson-list ${isOpen?'show':''}">`;
				ch.lessons.forEach((lesson, lIdx) => {
					const lKey = chIdx + '-' + lIdx;
					const isDone = state.completedLessons[s] && state.completedLessons[s][lKey];
					html += `
				<li class="lesson-item ${s}-item ${isDone?'done':''}" onclick="toggleLesson('${s}','${chIdx}','${lIdx}')">
				  <div class="lesson-check">${isDone?'✓':''}</div>
				  <span>${lesson}</span>
				  <div class="lesson-actions">
				    <button class="btn-note-inline" onclick="event.stopPropagation(); openNoteForLesson('${s}', '${lesson.replace(/'/g, "\\'")}')" title="Ghi chú cho bài này">📝</button>
				  </div>
				</li>`;
				});
				html += '</ul></div>';
			});
			if (data.length === 0) html =
				'<div style="text-align:center;color:var(--sub);padding:20px;">Chưa có dữ liệu chi tiết 📝</div>';
			container.innerHTML = html;
		}

		function toggleLesson(subject, chIdx, lIdx) {
			const lKey = chIdx + '-' + lIdx;
			if (!state.completedLessons[subject]) state.completedLessons[subject] = {};
			if (state.completedLessons[subject][lKey]) {
				delete state.completedLessons[subject][lKey];
			} else {
				state.completedLessons[subject][lKey] = true;
			}
			saveAll();
			updateAllLessonProgress();
			updateProgressBars();
			renderDetailTab();
		}

		function updateAllLessonProgress() {
			['toan', 'ly', 'tin'].forEach(s => {
				const data = LESSON_DATA[s] || [];
				let total = 0,
					done = 0;
				data.forEach((ch, chIdx) => {
					ch.lessons.forEach((_, lIdx) => {
						total++;
						const lKey = chIdx + '-' + lIdx;
						if (state.completedLessons[s] && state.completedLessons[s][lKey]) done++;
					});
				});
				const pct = total > 0 ? Math.round((done / total) * 100) : 0;
				const bar = document.getElementById('bar-' + s);
				if (bar) bar.style.width = pct + '%';
			});
		}

		// ─── TIMER ────────────────────────────────────────────────────────────────────
		function requestNotificationPermission() {
			if (Notification.permission === 'default') {
				Notification.requestPermission();
			}
		}

		function getDuration() { return (parseInt(document.getElementById('duration-input').value) || 120) * 60; }

		function toggleTimer() {
			requestNotificationPermission();
			if (state.running) { pauseTimer(); } else { startTimer(); }
		}

		function startTimer() {
			if (state.remainSecs <= 0) state.remainSecs = getDuration();
			state.totalSecs = getDuration();
			state.running = true;
			document.getElementById('btn-start').textContent = '⏸ Tạm dừng';
			document.getElementById('clock-label').textContent = 'Đang học... Cố lên! 💪';
			state.interval = setInterval(tick, 1000);
			// Lưu thời điểm kết thúc để chạy ngầm
			state.endTime = Date.now() + state.remainSecs * 1000;
			saveAll();
		}

		function pauseTimer() {
			state.running = false;
			clearInterval(state.interval);
			document.getElementById('btn-start').textContent = '▶ Tiếp tục';
			document.getElementById('clock-label').textContent = 'Đã tạm dừng ☕';
			state.endTime = null;
			saveAll();
		}

		function resetTimer(silent = false) {
			state.running = false;
			clearInterval(state.interval);
			state.remainSecs = getDuration();
			state.totalSecs = getDuration();
			state.endTime = null;
			document.getElementById('btn-start').textContent = '▶ Bắt đầu';
			document.getElementById('clock-label').textContent = 'Sẵn sàng học! 💪';
			updateTimerDisplay();
			if (!silent) document.getElementById('ring-prog').style.strokeDashoffset = 510;
			saveAll();
		}

		function tick() {
			if (state.remainSecs <= 0) { finishSession(); return; }
			state.remainSecs--;
			updateTimerDisplay();
			// Thỉnh thoảng đồng bộ lại với endTime nếu có
			if (state.endTime && Math.abs(state.endTime - (Date.now() + state.remainSecs * 1000)) > 2000) {
				state.remainSecs = Math.max(0, Math.floor((state.endTime - Date.now()) / 1000));
			}
		}

		function updateTimerDisplay() {
			const m = Math.floor(state.remainSecs / 60).toString().padStart(2, '0');
			const s = (state.remainSecs % 60).toString().padStart(2, '0');
			document.getElementById('clock-display').textContent = m + ':' + s;
			const prog = document.getElementById('ring-prog');
			const total = state.totalSecs || getDuration();
			const fraction = 1 - (state.remainSecs / total);
			const offset = 510 - (510 * fraction);
			prog.style.strokeDashoffset = offset;
		}

		function finishSession() {
			state.running = false;
			clearInterval(state.interval);
			state.remainSecs = 0;
			state.endTime = null;
			updateTimerDisplay();
			document.getElementById('btn-start').textContent = '▶ Bắt đầu';
			document.getElementById('clock-label').textContent = '✅ Hoàn thành! Tuyệt vời!';
			const s = state.subject;
			state.sessions[s] = (state.sessions[s] || 0) + 1;
			saveAll();
			updateProgressBars();
			playChime();
			
			const info = SUBJECT_INFO[s];
			const title = '🎉 Hoàn thành phiên ' + info.name + '!';
			const msg = 'Đã học ' + state.sessions[s] + ' phiên hôm nay. Nghỉ ngơi chút nhé! 🌟';
			
			showToast('🎉', 'Xong phiên!', msg);
			
			if (Notification.permission === 'granted') {
				new Notification(title, { body: msg, icon: 'https://cdn-icons-png.flaticon.com/512/3079/3079165.png' });
			}
		}

		function playChime() {
			try {
				const ctx = new(window.AudioContext || window.webkitAudioContext)();
				const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
				notes.forEach((freq, i) => {
					const osc = ctx.createOscillator();
					const gain = ctx.createGain();
					osc.connect(gain);
					gain.connect(ctx.destination);
					osc.type = 'triangle';
					osc.frequency.value = freq;
					const t = ctx.currentTime + i * 0.25;
					gain.gain.setValueAtTime(0, t);
					gain.gain.linearRampToValueAtTime(0.6, t + 0.05);
					gain.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
					osc.start(t);
					osc.stop(t + 0.9);
				});
			} catch (e) {}
		}

		// ─── NOTES ────────────────────────────────────────────────────────────────────
		function switchNoteTab(s) {
			state.noteTab = s;
			['toan', 'ly', 'tin'].forEach(t => {
				const el = document.getElementById('tab-' + t);
				el.className = t === s ? 'note-tab active-tab-' + t : 'note-tab';
			});
			renderSavedNotes();
			clearNoteInput();
		}

		function openNoteForLesson(subject, lessonName) {
			selectSubject(subject);
			switchNoteTab(subject);
			document.getElementById('note-subject').value = lessonName;
			document.getElementById('note-input').focus();
			document.getElementById('note-input').scrollIntoView({ behavior: 'smooth', block: 'center' });
		}

		function insertLatex(text) {
			const ta = document.getElementById('note-input');
			const start = ta.selectionStart,
				end = ta.selectionEnd;
			ta.value = ta.value.slice(0, start) + text + ta.value.slice(end);
			ta.focus();
			ta.selectionStart = ta.selectionEnd = start + text.length;
		}

		function renderKatex(el) {
			renderMathInElement(el, {
				delimiters: [
					{ left: '$$', right: '$$', display: true },
					{ left: '$', right: '$', display: false },
				],
				throwOnError: false,
			});
		}

		function editNote(tag, idx) {
			const note = state.notes[tag][idx];
			document.getElementById('note-subject').value = note.subject === 'Ghi chú tự do' ? '' : note.subject;
			document.getElementById('note-input').value = note.text;
			state.editingIdx = idx;
			document.getElementById('note-input').focus();
			document.querySelector('.note-editor').scrollIntoView({ behavior: 'smooth', block: 'center' });
			document.querySelector('.btn-render').innerHTML = '🔄 Cập nhật &amp; Render';
		}

		function saveNote() {
			const subject = document.getElementById('note-subject').value.trim();
			const text = document.getElementById('note-input').value.trim();
			if (!text) {
				showToast('⚠️', 'Lỗi!', 'Bạn chưa nhập nội dung ghi chú.');
				return;
			}
			const finalSubject = subject || 'Ghi chú tự do';
			
			const preview = document.getElementById('note-preview');
			preview.innerHTML = '';
			text.split('\n').filter(l => l.trim()).forEach(line => {
				const p = document.createElement('p');
				p.textContent = line;
				preview.appendChild(p);
			});
			renderKatex(preview);
			preview.classList.add('has-content');
			
			const now = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
			const tag = state.noteTab;
			
			if (state.editingIdx !== null) {
				state.notes[tag][state.editingIdx] = { subject: finalSubject, text, time: now + ' (đã sửa)', tag };
				state.editingIdx = null;
				showToast('📝', 'Đã cập nhật!', 'Ghi chú "' + finalSubject + '" đã được cập nhật ✅');
			} else {
				state.notes[tag].unshift({ subject: finalSubject, text, time: now, tag });
				showToast('📝', 'Đã lưu ghi chú!', 'Ghi chú "' + finalSubject + '" đã được lưu ✅');
			}
			
			saveAll();
			renderSavedNotes();
			clearNoteInput();
		}

		function clearNoteInput() {
			state.editingIdx = null;
			document.getElementById('note-subject').value = '';
			document.getElementById('note-input').value = '';
			document.getElementById('note-preview').innerHTML =
				'<span class="preview-empty">Nhập ghi chú rồi nhấn "Lưu & Render" ✨</span>';
			document.getElementById('note-preview').classList.remove('has-content');
			document.querySelector('.btn-render').innerHTML = '💾 Lưu &amp; Render';
		}

		function toggleNoteBody(idx) {
			const body = document.getElementById('note-body-' + idx);
			if (body) body.classList.toggle('show');
		}

		function deleteNote(tag, idx) {
			if (confirm('Bạn có chắc muốn xoá ghi chú này?')) {
				state.notes[tag].splice(idx, 1);
				saveAll();
				renderSavedNotes();
			}
		}

		function renderSavedNotes() {
			const tag = state.noteTab;
			const list = document.getElementById('saved-list');
			const notes = state.notes[tag] || [];
			document.getElementById('note-count').textContent = notes.length + ' ghi chú';
			if (notes.length === 0) {
				list.innerHTML =
					'<div style="text-align:center;color:var(--sub);font-size:12px;padding:14px;background:var(--bg2);border-radius:10px;border:1.5px dashed var(--border);">Chưa có ghi chú nào ✨</div>';
				return;
			}
			list.innerHTML = '';
			notes.forEach((note, i) => {
				const div = document.createElement('div');
				div.className = 'saved-note-item';
				div.innerHTML = `
				<div class="note-header" onclick="toggleNoteBody(${i})">
					<div class="note-header-left">
						<div class="note-subject-title">${note.subject || 'Ghi chú tự do'}</div>
						<div class="note-time">⏰ ${note.time} <span class="tag tag-${tag}">${SUBJECT_INFO[tag]?.emoji||''} ${tag.toUpperCase()}</span></div>
					</div>
					<div style="display:flex; gap: 5px;">
						<button class="btn-edit" onclick="event.stopPropagation(); editNote('${tag}',${i})" title="Sửa">✏️</button>
						<button class="btn-del" onclick="event.stopPropagation(); deleteNote('${tag}',${i})" title="Xoá">✕</button>
					</div>
				</div>
				<div class="note-body" id="note-body-${i}">
					<div class="note-content" id="sn-${i}"></div>
				</div>
			`;
				list.appendChild(div);
				const contentEl = div.querySelector('#sn-' + i);
				(note.text || '').split('\n').filter(l => l.trim()).forEach(line => {
					const p = document.createElement('p');
					p.textContent = line;
					contentEl.appendChild(p);
				});
				renderKatex(contentEl);
			});
		}

		// ─── VAN TOGGLE ───────────────────────────────────────────────────────────────
		let vanOpen = false;

		function toggleVan() {
			vanOpen = !vanOpen;
			document.getElementById('van-body').classList.toggle('show', vanOpen);
			document.getElementById('van-toggle').classList.toggle('open', vanOpen);
		}

		// ─── TOAST ────────────────────────────────────────────────────────────────────
		let toastTimer;

		function showToast(icon, title, msg) {
			const t = document.getElementById('toast');
			document.getElementById('toast-icon').textContent = icon;
			document.getElementById('toast-title').textContent = title;
			document.getElementById('toast-msg').textContent = msg;
			t.classList.add('show');
			clearTimeout(toastTimer);
			toastTimer = setTimeout(() => t.classList.remove('show'), 4500);
		}

		// ─── INIT ─────────────────────────────────────────────────────────────────────
		window.addEventListener('load', () => {
			loadAll();
			// Mở chương đầu tiên mặc định
			if (!state.expandedChapters['toan-0']) state.expandedChapters['toan-0'] = true;
			if (!state.expandedChapters['ly-0']) state.expandedChapters['ly-0'] = true;
			if (!state.expandedChapters['tin-0']) state.expandedChapters['tin-0'] = true;
			renderDetailTab();
			selectSubject('toan');
			document.getElementById('exam-date-input').value = state.examDate;
		});
	</script>
</body>
</html>
</template>
<script>
(function(){var tabs=Array.prototype.slice.call(document.querySelectorAll('.studyhub-tab'));var panels={algo:document.getElementById('panel-algo'),xps:document.getElementById('panel-xps'),sr:document.getElementById('panel-sr')};document.getElementById('algo-frame').srcdoc=document.getElementById('algo-template').innerHTML;document.getElementById('xps-frame').srcdoc=document.getElementById('xps-template').innerHTML;function activate(name){var selected=panels[name]?name:'algo';tabs.forEach(function(tab){tab.classList.toggle('active',tab.dataset.tab===selected)});Object.keys(panels).forEach(function(key){panels[key].classList.toggle('active',key===selected)});localStorage.setItem('studyhub_active_tab',selected)}tabs.forEach(function(tab){tab.addEventListener('click',function(){activate(tab.dataset.tab)})});activate(localStorage.getItem('studyhub_active_tab')||'algo')})();
(function(){var STORAGE_KEY='spaced_repetition_cards';var minute=60000;var day=24*60*minute;var intervals={1:20*minute,2:day,3:3*day,4:7*day,5:14*day,6:30*day,7:90*day,8:180*day,9:365*day,10:730*day};var els={total:document.getElementById('sr-total'),dueCount:document.getElementById('sr-due-count'),futureCount:document.getElementById('sr-future-count'),duePill:document.getElementById('sr-due-pill'),futurePill:document.getElementById('sr-future-pill'),dueList:document.getElementById('sr-due-list'),futureList:document.getElementById('sr-future-list'),modal:document.getElementById('sr-modal'),form:document.getElementById('sr-form'),title:document.getElementById('sr-title-input'),content:document.getElementById('sr-content-input')};function loadCards(){try{var raw=localStorage.getItem(STORAGE_KEY);var parsed=raw?JSON.parse(raw):[];return Array.isArray(parsed)?parsed:[]}catch(e){return[]}}var cards=loadCards();function saveCards(){localStorage.setItem(STORAGE_KEY,JSON.stringify(cards))}function nextInterval(stage){if(stage<=10)return intervals[stage]||intervals[1];return 5*365*day}function nextReviewDate(stage,fromTime){return new Date(fromTime+nextInterval(stage)).toISOString()}function fmtDate(iso){if(!iso)return'Chưa ôn';return new Intl.DateTimeFormat('vi-VN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(iso))}function daysUntil(iso){var diff=new Date(iso).setHours(0,0,0,0)-new Date().setHours(0,0,0,0);return Math.ceil(diff/day)}function escapeHtml(value){return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function renderMarkdown(value){var escaped=escapeHtml(value||'');var codeRe=new RegExp('\\x60([^\\x60]+)\\x60','g');return escaped.split(/\n{2,}/).map(function(block){return block.replace(codeRe,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\n/g,'<br>')}).map(function(block){return '<p>'+block+'</p>'}).join('')}function cardEl(card,due){var node=document.createElement('article');node.className='sr-card';var delta=daysUntil(card.nextReviewAt);var deltaText=delta<=0?'Đến hạn hôm nay':'Còn '+delta+' ngày';var remember=due?'<button class="sr-btn success" type="button" data-action="remember" data-id="'+escapeHtml(card.id)+'">✅ Đã nhớ</button> ':'';node.innerHTML='<div class="sr-card-head"><div class="sr-card-title"><h3>'+escapeHtml(card.title)+'</h3><div class="sr-meta"><span class="sr-pill">Stage '+escapeHtml(card.stage)+'</span><span>Tạo: '+fmtDate(card.createdAt)+'</span><span>Ôn gần nhất: '+fmtDate(card.lastReviewedAt)+'</span></div></div></div><div class="sr-content">'+renderMarkdown(card.content)+'</div><div class="sr-card-actions"><span class="'+(due?'sr-due-now':'sr-future')+'">Ôn tiếp: '+fmtDate(card.nextReviewAt)+' · '+deltaText+'</span><div>'+remember+'<button class="sr-btn danger" type="button" data-action="delete" data-id="'+escapeHtml(card.id)+'">Xóa</button></div></div>';return node}function render(){var now=Date.now();cards=cards.map(function(card){var stage=Number(card.stage)||1;return Object.assign({},card,{stage:stage,createdAt:card.createdAt||new Date().toISOString(),nextReviewAt:card.nextReviewAt||nextReviewDate(stage,now)})});var due=cards.filter(function(card){return new Date(card.nextReviewAt).getTime()<=now}).sort(function(a,b){return new Date(a.nextReviewAt)-new Date(b.nextReviewAt)});var future=cards.filter(function(card){return new Date(card.nextReviewAt).getTime()>now}).sort(function(a,b){return new Date(a.nextReviewAt)-new Date(b.nextReviewAt)});els.total.textContent=cards.length;els.dueCount.textContent=due.length;els.futureCount.textContent=future.length;els.duePill.textContent=due.length+' thẻ';els.futurePill.textContent=future.length+' thẻ';els.dueList.innerHTML='';els.futureList.innerHTML='';if(!due.length){els.dueList.innerHTML='<div class="sr-empty">Không có thẻ đến hạn ở thời điểm này.</div>'}else{due.forEach(function(card){els.dueList.appendChild(cardEl(card,true))})}if(!future.length){els.futureList.innerHTML='<div class="sr-empty">Chưa có thẻ trong lịch ôn tương lai.</div>'}else{future.forEach(function(card){els.futureList.appendChild(cardEl(card,false))})}}function openModal(){els.form.reset();els.modal.classList.add('open');setTimeout(function(){els.title.focus()},50)}function closeModal(){els.modal.classList.remove('open')}document.getElementById('sr-new-card').addEventListener('click',openModal);document.getElementById('sr-close-modal').addEventListener('click',closeModal);document.getElementById('sr-cancel').addEventListener('click',closeModal);els.modal.addEventListener('click',function(event){if(event.target===els.modal)closeModal()});els.form.addEventListener('submit',function(event){event.preventDefault();var now=Date.now();var title=els.title.value.trim();var content=els.content.value.trim();if(!title||!content)return;cards.push({id:'sr_'+now+'_'+Math.random().toString(36).slice(2),title:title,content:content,createdAt:new Date(now).toISOString(),lastReviewedAt:null,stage:1,nextReviewAt:nextReviewDate(1,now)});saveCards();closeModal();render()});document.addEventListener('click',function(event){var button=event.target.closest('[data-action][data-id]');if(!button)return;var action=button.dataset.action;var id=button.dataset.id;var index=cards.findIndex(function(card){return card.id===id});if(index===-1)return;if(action==='remember'){var now=Date.now();var nextStage=(Number(cards[index].stage)||1)+1;cards[index]=Object.assign({},cards[index],{stage:nextStage,lastReviewedAt:new Date(now).toISOString(),nextReviewAt:nextReviewDate(nextStage,now)});saveCards();render()}if(action==='delete'){if(!confirm('Xóa thẻ này?'))return;cards.splice(index,1);saveCards();render()}});render()})();
</script>
</body>
