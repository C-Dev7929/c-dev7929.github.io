// ─────────────────────────────────────────────────────
const Dashboard=({algorithms,completed,notes,onOpenAlgo})=>{
  const [now,setNow]=React.useState(new Date());
  React.useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t);},[]);

  const total=algorithms.length;
  const completedCount=Object.values(completed).filter(Boolean).length;
  const notedCount=Object.keys(notes).length;
  const pct=Math.round((completedCount/total)*100);

  const BASIC_CATS=['Nhập môn','Về cách học Tin học','Kĩ năng thi cử','Các kỹ thuật cơ bản'];
  const basicDone=algorithms.filter(a=>BASIC_CATS.includes(a.category)).every(a=>completed[a.id]);

  const recommended=React.useMemo(()=>{
    const sorted=[...algorithms].sort((a,b)=>{
      const ai=CATEGORY_ORDER.indexOf(a.category),bi=CATEGORY_ORDER.indexOf(b.category);
      return(ai-bi)||(a.stars-b.stars);
    });
    return sorted.filter(a=>!completed[a.id]).slice(0,6);
  },[algorithms,completed]);

  const catStats=CATEGORY_ORDER.map(cat=>{
    const catAlgos=algorithms.filter(a=>a.category===cat);
    const done=catAlgos.filter(a=>completed[a.id]).length;
    return{cat,total:catAlgos.length,done};
  }).filter(c=>c.total>0);

  const greeting=now.getHours()<12?'Chào buổi sáng':now.getHours()<18?'Chào buổi chiều':'Chào buổi tối';
  const timeString=now.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const dateString=now.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'});

  return(
    <div className="animate-fade space-y-6">
      <div className="card p-6 grid-bg" style={{background:'linear-gradient(135deg,var(--bg-card),var(--bg-elevated))'}}>
        <div style={{fontSize:13,color:'var(--text-muted)',marginBottom:4,textTransform:'uppercase',letterSpacing:'1px'}}>
          {now.toLocaleDateString('vi-VN',{weekday:'long'})}
        </div>
        <h1 style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:26,color:'var(--text-primary)',marginBottom:4,display:'flex',alignItems:'baseline',flexWrap:'wrap',gap:12}}>
          <span>{greeting}! 🎯</span>
          <span style={{fontSize:15,color:'var(--accent)',fontFamily:'var(--font-mono)',fontWeight:600}}>
            [{timeString} — {dateString}]
          </span>
        </h1>
        <p style={{color:'var(--text-secondary)',fontSize:14,marginBottom:16}}>
          {completedCount===0?'Hãy bắt đầu hành trình chinh phục thuật toán!':
           `Bạn đã hoàn thành ${completedCount}/${total} thuật toán. ${pct>=80?'🔥 Xuất sắc!':pct>=50?'💪 Tiếp tục phát huy!':'⚡ Cố lên!'}`}
        </p>
        <div className="progress-bar"><div className="progress-fill" style={{width:`${pct}%`}}/></div>
        <div className="flex justify-between mt-2" style={{fontSize:12,color:'var(--text-muted)'}}>
          <span>{completedCount} / {total} thuật toán</span>
          <span style={{color:'var(--accent)',fontWeight:700}}>{pct}%</span>
        </div>
      </div>

      <div className="grid grid-cols-2 gap-4 sm:grid-cols-4">
        {[
          {icon:'target',label:'Tổng thuật toán',value:total,color:'#4f8ef7'},
          {icon:'check-circle',label:'Đã hoàn thành',value:completedCount,color:'#34d399'},
          {icon:'book-open',label:'Có ghi chú',value:notedCount,color:'#a78bfa'},
          {icon:'trending-up',label:'Tiến độ',value:`${pct}%`,color:'#fbbf24'},
        ].map(s=>(
          <div key={s.label} className="card p-4 text-center">
            <div style={{color:s.color,marginBottom:8,display:'flex',justifyContent:'center'}}><Icon name={s.icon} size={22}/></div>
            <div style={{fontFamily:'var(--font-mono)',fontWeight:800,fontSize:22,color:'var(--text-primary)'}}>{s.value}</div>
            <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>{s.label}</div>
          </div>
        ))}
      </div>

      <div className="grid grid-cols-1 gap-6 lg:grid-cols-2">
        <Pomodoro/>
        <div className="card p-5">
          <div className="flex items-center gap-2 mb-4">
            <Icon name="zap" size={18} style={{color:'var(--accent)'}}/>
            <h2 style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:18,color:'var(--text-primary)'}}>Gợi ý tiếp theo</h2>
          </div>
          {!basicDone&&(
            <div className="card-elevated p-3 mb-3" style={{borderLeft:'3px solid var(--warning)',fontSize:12,color:'var(--warning)'}}>
              💡 Hoàn thành Nhập môn & Kỹ thuật cơ bản trước!
            </div>
          )}
          <div className="space-y-2">
            {recommended.map(a=>(
              <div key={a.id} className="flex items-center gap-3 p-3 card-elevated rounded-lg cursor-pointer"
                style={{border:'1px solid transparent',transition:'border-color .2s'}}
                onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent)'}
                onMouseLeave={e=>e.currentTarget.style.borderColor='transparent'}
                onClick={()=>onOpenAlgo(a)}>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:700,color:'var(--text-primary)'}}>{a.name}</div>
                  <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>{a.category}</div>
                </div>
                <Stars n={a.stars}/>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="card p-5">
        <div className="flex items-center gap-2 mb-5">
          <Icon name="bar-chart" size={18} style={{color:'var(--accent)'}}/>
          <h2 style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:18,color:'var(--text-primary)'}}>Tiến độ theo danh mục</h2>
        </div>
        <div className="space-y-3">
          {catStats.map(c=>(
            <div key={c.cat}>
              <div className="flex justify-between mb-1">
                <span style={{fontSize:13,color:'var(--text-secondary)',fontWeight:600}}>{c.cat}</span>
                <span style={{fontSize:12,fontFamily:'var(--font-mono)',color:'var(--text-muted)'}}>{c.done}/{c.total}</span>
              </div>
              <div className="progress-bar">
                <div className="progress-fill" style={{width:`${c.total?(c.done/c.total)*100:0}%`}}/>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

// ─────────────────────────────────────────────────────
//  ALGO LIST
// ─────────────────────────────────────────────────────
const AlgoList=({algorithms,completed,notes,onOpenAlgo})=>{
  const [search,setSearch]=React.useState('');
  const [filterCat,setFilterCat]=React.useState('Tất cả');
  const [filterStar,setFilterStar]=React.useState(0);
  const [filterStatus,setFilterStatus]=React.useState('all');
  const [sortBy,setSortBy]=React.useState('category');
  const [showFilters,setShowFilters]=React.useState(false);

  const categories=['Tất cả',...CATEGORY_ORDER.filter(c=>algorithms.some(a=>a.category===c))];

  const filtered=React.useMemo(()=>{
    let list=[...algorithms];
    if(search)list=list.filter(a=>a.name.toLowerCase().includes(search.toLowerCase())||a.category.toLowerCase().includes(search.toLowerCase()));
    if(filterCat!=='Tất cả')list=list.filter(a=>a.category===filterCat);
    if(filterStar>0)list=list.filter(a=>a.stars===filterStar);
    if(filterStatus==='done')list=list.filter(a=>completed[a.id]);
    if(filterStatus==='todo')list=list.filter(a=>!completed[a.id]);
    if(filterStatus==='noted')list=list.filter(a=>notes[a.id]);
    if(sortBy==='stars')list.sort((a,b)=>a.stars-b.stars);
    else if(sortBy==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'vi'));
    else list.sort((a,b)=>(CATEGORY_ORDER.indexOf(a.category)-CATEGORY_ORDER.indexOf(b.category))||(a.stars-b.stars));
    return list;
  },[algorithms,search,filterCat,filterStar,filterStatus,sortBy,completed,notes]);

  const grouped=React.useMemo(()=>{
    if(sortBy!=='category')return null;
    const g={};
    filtered.forEach(a=>{if(!g[a.category])g[a.category]=[];g[a.category].push(a);});
    return g;
  },[filtered,sortBy]);

  return(
    <div className="animate-fade">
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <h1 style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:24,color:'var(--text-primary)'}}>
          📚 Danh sách Thuật toán
          <span style={{marginLeft:8,fontSize:14,color:'var(--text-muted)',fontWeight:400}}>{filtered.length}/{algorithms.length}</span>
        </h1>
        <button onClick={()=>setShowFilters(f=>!f)} className="btn-ghost" style={{display:'flex',alignItems:'center',gap:6}}>
          <Icon name="filter" size={14}/> Bộ lọc
        </button>
      </div>

      <div className="relative mb-4">
        <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'var(--text-muted)'}}><Icon name="search" size={15}/></span>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Tìm kiếm thuật toán..."
          style={{width:'100%',background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:10,padding:'10px 14px 10px 38px',color:'var(--text-primary)',fontFamily:'var(--font-display)',fontSize:14,outline:'none'}}
          onFocus={e=>e.target.style.borderColor='var(--accent)'}
          onBlur={e=>e.target.style.borderColor='var(--border)'}/>
      </div>

      {showFilters&&(
        <div className="card-elevated p-4 mb-4 animate-fade space-y-3">
          <div>
            <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:6,fontWeight:700,textTransform:'uppercase'}}>Danh mục</div>
            <div className="flex flex-wrap gap-2">
              {categories.map(c=>(
                <button key={c} onClick={()=>setFilterCat(c)} className={filterCat===c?'btn-primary':'btn-ghost'} style={{padding:'4px 10px',fontSize:12}}>{c}</button>
              ))}
            </div>
          </div>
          <div>
            <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:6,fontWeight:700,textTransform:'uppercase'}}>Độ khó</div>
            <div className="flex gap-2 flex-wrap">
              {[0,1,2,3,4,5].map(s=>(
                <button key={s} onClick={()=>setFilterStar(s)} className={filterStar===s?'btn-primary':'btn-ghost'} style={{padding:'4px 10px',fontSize:12}}>
                  {s===0?'Tất cả':'★'.repeat(s)}
                </button>
              ))}
            </div>
          </div>
          <div>
            <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:6,fontWeight:700,textTransform:'uppercase'}}>Trạng thái</div>
            <div className="flex gap-2 flex-wrap">
              {[['all','Tất cả'],['done','✓ Xong'],['todo','⏳ Chưa học'],['noted','📝 Có ghi chú']].map(([v,l])=>(
                <button key={v} onClick={()=>setFilterStatus(v)} className={filterStatus===v?'btn-primary':'btn-ghost'} style={{padding:'4px 10px',fontSize:12}}>{l}</button>
              ))}
            </div>
          </div>
          <div>
            <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:6,fontWeight:700,textTransform:'uppercase'}}>Sắp xếp</div>
            <div className="flex gap-2 flex-wrap">
              {[['category','Theo danh mục'],['stars','Theo độ khó'],['name','Theo tên']].map(([v,l])=>(
                <button key={v} onClick={()=>setSortBy(v)} className={sortBy===v?'btn-primary':'btn-ghost'} style={{padding:'4px 10px',fontSize:12}}>{l}</button>
              ))}
            </div>
          </div>
        </div>
      )}

      {grouped?(
        Object.entries(grouped).map(([cat,algos])=>(
          <div key={cat} className="mb-6">
            <div className="flex items-center gap-2 mb-3">
              <span className={`tag ${CAT_COLORS[cat]||'cat-0'}`}>{cat}</span>
              <span style={{fontSize:12,color:'var(--text-muted)'}}>{algos.filter(a=>completed[a.id]).length}/{algos.length}</span>
            </div>
            <div className="grid grid-cols-1 gap-2 sm:grid-cols-2">
              {algos.map(a=><AlgoCard key={a.id} algo={a} note={notes[a.id]} completed={!!completed[a.id]} onOpen={onOpenAlgo}/>)}
            </div>
          </div>
        ))
      ):(
        <div className="grid grid-cols-1 gap-2 sm:grid-cols-2">
          {filtered.map(a=><AlgoCard key={a.id} algo={a} note={notes[a.id]} completed={!!completed[a.id]} onOpen={onOpenAlgo}/>)}
        </div>
      )}

      {filtered.length===0&&(
        <div className="text-center py-16" style={{color:'var(--text-muted)'}}>
          <Icon name="search" size={40} className="mx-auto mb-3 opacity-30"/>
          <div style={{fontSize:15,fontWeight:600}}>Không tìm thấy thuật toán nào</div>
        </div>
      )}
    </div>
  );
};

// ─────────────────────────────────────────────────────
//  SCHEDULE
// ─────────────────────────────────────────────────────
const Schedule=({algorithms,completed,onOpenAlgo})=>{
  const toast=useToast();
  const [activeTab,setActiveTab]=React.useState('algo');
  const [schedule,setSchedule]=React.useState(()=>LS.get('schedule',{}));
  const today=new Date().toISOString().slice(0,10);
  const [selectedDate,setSelectedDate]=React.useState(today);
  const [showPicker,setShowPicker]=React.useState(null);

  const SLOTS=['07:00','08:00','09:00','10:00','14:00','15:00','16:00','19:00','20:00','21:00'];
  const daySchedule=schedule[selectedDate]||{};

  const assignAlgo=(slot,algoId)=>{
    const updated={...schedule,[selectedDate]:{...daySchedule,[slot]:algoId}};
    setSchedule(updated);LS.set('schedule',updated);setShowPicker(null);
    toast('📅 Đã thêm vào lịch!','success',2000);
  };
  const removeAlgo=(slot)=>{
    const day={...daySchedule};delete day[slot];
    const updated={...schedule,[selectedDate]:day};
    setSchedule(updated);LS.set('schedule',updated);
    toast('🗑️ Đã xóa khỏi lịch','info',2000);
  };

  const days7=Array.from({length:7},(_,i)=>{
    const d=new Date();d.setDate(d.getDate()+i);return d.toISOString().slice(0,10);
  });

  // TKB school
  const PERIODS={s1:[7,0,7,45],s2:[7,50,8,35],s3:[8,45,9,30],s4:[9,35,10,20],s5:[10,25,11,10],c1:[12,45,13,30],c2:[13,35,14,20],c3:[14,30,15,15],c4:[15,20,16,5],c5:[16,10,16,55]};
  const TKB_SLOTS=['s1','s2','s3','s4','s5','c1','c2','c3','c4','c5'];
  const SLOT_SHORT={s1:'S1',s2:'S2',s3:'S3',s4:'S4',s5:'S5',c1:'C1',c2:'C2',c3:'C3',c4:'C4',c5:'C5'};
  const TKB_DAYS=['mon','tue','wed','thu','fri','sat'];
  const DAY_LABELS=['T2','T3','T4','T5','T6','T7'];
  const DAY_FULL=['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];

  const createEmptyTKB=()=>{
    const tkb={};
    TKB_SLOTS.forEach(s=>{tkb[s]={};TKB_DAYS.forEach(d=>tkb[s][d]='');});
    return tkb;
  };

  const [tkb,setTkb]=React.useState(()=>{try{return JSON.parse(localStorage.getItem('algo_tkb_v1'))||createEmptyTKB();}catch{return createEmptyTKB();}});
  const [editingTKB,setEditingTKB]=React.useState(false);
  const [savedBadge,setSavedBadge]=React.useState(false);
  const [now,setNow]=React.useState(new Date());
  React.useEffect(()=>{const t=setInterval(()=>setNow(new Date()),30000);return()=>clearInterval(t);},[]);

  const currentSlot=React.useMemo(()=>{
    const total=now.getHours()*60+now.getMinutes();
    return TKB_SLOTS.find(s=>{const[sh,sm,eh,em]=PERIODS[s];return total>=sh*60+sm&&total<eh*60+em;})||null;
  },[now]);

  const todayColIdx=now.getDay()>=1&&now.getDay()<=6?now.getDay()-1:null;

  const handleTKBInput=(slot,day,value)=>{
    const updated={...tkb,[slot]:{...tkb[slot],[day]:value}};
    setTkb(updated);localStorage.setItem('algo_tkb_v1',JSON.stringify(updated));
    setSavedBadge(true);setTimeout(()=>setSavedBadge(false),1200);
  };

  const resetTKB=()=>{
    if(!window.confirm('Xóa toàn bộ thời khóa biểu trường?'))return;
    const empty=createEmptyTKB();setTkb(empty);localStorage.setItem('algo_tkb_v1',JSON.stringify(empty));
    toast('🗑️ Đã xóa thời khóa biểu','warning');
  };

  const fmtHM=(h,m)=>`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;

  const tabStyle=(key)=>({
    display:'flex',alignItems:'center',gap:7,padding:'8px 18px',borderRadius:7,border:'none',
    fontFamily:'var(--font-display)',fontWeight:700,fontSize:13,cursor:'pointer',transition:'all .2s',
    background:activeTab===key?'var(--accent)':'transparent',
    color:activeTab===key?'#fff':'var(--text-secondary)',
    boxShadow:activeTab===key?'0 2px 8px var(--accent-glow)':'none',
  });

  return(
    <div className="animate-fade">
      <h1 style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:24,color:'var(--text-primary)',marginBottom:20}}>📅 Thời khóa biểu</h1>

      <div style={{display:'flex',gap:0,marginBottom:24,background:'var(--bg-elevated)',borderRadius:10,padding:4,width:'fit-content',border:'1px solid var(--border)'}}>
        <button onClick={()=>setActiveTab('algo')} style={tabStyle('algo')}><Icon name="calendar" size={14}/>Lịch học Thuật toán</button>
        <button onClick={()=>setActiveTab('school')} style={tabStyle('school')}><Icon name="clock" size={14}/>TKB Trường</button>
      </div>

      {activeTab==='algo'&&(
        <div className="animate-fade">
          <div style={{display:'flex',gap:8,overflowX:'auto',paddingBottom:8,marginBottom:20}}>
            {days7.map(d=>{
              const date=new Date(d+'T00:00:00');
              const slots=Object.keys(schedule[d]||{}).length;
              return(
                <button key={d} onClick={()=>setSelectedDate(d)}
                  className={selectedDate===d?'btn-primary':'btn-ghost'}
                  style={{flexShrink:0,padding:'8px 14px',display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
                  <span style={{fontSize:11,textTransform:'uppercase'}}>{date.toLocaleDateString('vi-VN',{weekday:'short'})}</span>
                  <span style={{fontFamily:'var(--font-mono)',fontWeight:800,fontSize:16}}>{date.getDate()}</span>
                  {slots>0&&<span style={{fontSize:9,background:'var(--accent)',color:'white',borderRadius:8,padding:'1px 5px'}}>{slots}</span>}
                </button>
              );
            })}
          </div>

          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {SLOTS.map(slot=>{
              const algoId=daySchedule[slot];
              const algo=algoId?algorithms.find(a=>a.id===algoId):null;
              return(
                <div key={slot} style={{display:'flex',alignItems:'center',gap:14}}>
                  <div style={{width:52,flexShrink:0,fontFamily:'var(--font-mono)',fontSize:12,color:'var(--text-muted)',fontWeight:700}}>{slot}</div>
                  {algo?(
                    <div className="schedule-slot filled" style={{flex:1,display:'flex',alignItems:'center',gap:10}}>
                      <div style={{flex:1}}>
                        <div style={{fontSize:13,fontWeight:700,color:'var(--text-primary)'}}>{algo.name}</div>
                        <div style={{fontSize:11,color:'var(--text-muted)',marginTop:1}}>{algo.category} · <Stars n={algo.stars}/></div>
                      </div>
                      <button onClick={()=>onOpenAlgo(algo)} className="btn-primary" style={{padding:'4px 8px',fontSize:11}}>Học</button>
                      <button onClick={()=>removeAlgo(slot)} className="btn-ghost" style={{padding:'4px 8px',fontSize:11,color:'var(--danger)'}}>✕</button>
                    </div>
                  ):(
                    <div className="schedule-slot" style={{flex:1,display:'flex',alignItems:'center',gap:8,background:showPicker===slot?'var(--bg-elevated)':'transparent'}}
                      onClick={()=>setShowPicker(showPicker===slot?null:slot)}>
                      <Icon name="plus" size={14} style={{color:'var(--text-muted)'}}/>
                      <span style={{fontSize:13,color:'var(--text-muted)'}}>Thêm thuật toán...</span>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {showPicker!==null&&(
            <div className="card p-4 animate-fade" style={{marginTop:14}}>
              <div style={{fontSize:13,fontWeight:700,color:'var(--text-primary)',marginBottom:10}}>Chọn thuật toán cho {showPicker}:</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))',gap:8,maxHeight:300,overflowY:'auto'}}>
                {algorithms.filter(a=>!completed[a.id]).slice(0,30).map(a=>(
                  <div key={a.id} className="card-elevated" style={{padding:12,cursor:'pointer',border:'1px solid transparent',borderRadius:8,transition:'border-color .2s'}}
                    onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent)'}
                    onMouseLeave={e=>e.currentTarget.style.borderColor='transparent'}
                    onClick={()=>assignAlgo(showPicker,a.id)}>
                    <div style={{fontSize:13,fontWeight:600,color:'var(--text-primary)'}}>{a.name}</div>
                    <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>{a.category}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}

      {activeTab==='school'&&(
        <div className="animate-fade">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:10}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              {savedBadge&&<span style={{fontSize:12,color:'var(--success)',background:'rgba(52,211,153,.12)',padding:'4px 12px',borderRadius:20,fontWeight:700,fontFamily:'var(--font-mono)'}}>✓ Đã lưu</span>}
            </div>
            <div style={{display:'flex',gap:8}}>
              <button className="btn-primary" onClick={()=>setEditingTKB(e=>!e)} style={{display:'flex',alignItems:'center',gap:6}}>
                <Icon name={editingTKB?'x':'plus'} size={14}/>
                {editingTKB?'Đóng nhập TKB':'✏️ Nhập / Sửa TKB'}
              </button>
              {editingTKB&&<button className="btn-ghost" onClick={resetTKB} style={{color:'var(--danger)',borderColor:'var(--danger)',display:'flex',alignItems:'center',gap:6}}>
                <Icon name="trash" size={14}/> Xóa hết
              </button>}
            </div>
          </div>

          {currentSlot&&todayColIdx!==null&&tkb[currentSlot]&&(
            <div className="card animate-fade" style={{borderColor:'var(--accent)',background:'var(--accent-glow)',padding:'14px 18px',marginBottom:16,display:'flex',alignItems:'center',gap:14}}>
              <span style={{fontSize:26}}>⏰</span>
              <div>
                <div style={{fontSize:11,color:'var(--accent)',fontWeight:700,textTransform:'uppercase',fontFamily:'var(--font-mono)',marginBottom:3}}>
                  Đang diễn ra · {SLOT_SHORT[currentSlot]} {fmtHM(PERIODS[currentSlot][0],PERIODS[currentSlot][1])}–{fmtHM(PERIODS[currentSlot][2],PERIODS[currentSlot][3])}
                </div>
                <div style={{fontSize:20,fontWeight:800,color:'var(--text-primary)',fontFamily:'var(--font-display)'}}>
                  {tkb[currentSlot][TKB_DAYS[todayColIdx]]||'(Trống tiết)'}
                </div>
                <div style={{fontSize:12,color:'var(--text-secondary)',marginTop:2}}>{DAY_FULL[todayColIdx]}</div>
              </div>
            </div>
          )}

          {editingTKB&&(
            <div className="card animate-fade" style={{padding:16,marginBottom:20,overflowX:'auto'}}>
              <div style={{fontSize:13,fontWeight:700,color:'var(--text-primary)',marginBottom:12}}>✏️ Nhập tên môn học — tự động lưu khi gõ</div>
              <table style={{width:'100%',borderCollapse:'collapse',minWidth:540}}>
                <thead>
                  <tr>
                    <th style={{padding:'6px 10px',textAlign:'left',fontSize:11,color:'var(--text-muted)',fontWeight:700,textTransform:'uppercase',fontFamily:'var(--font-mono)',borderBottom:'1px solid var(--border)'}}>Tiết</th>
                    {DAY_LABELS.map((d,i)=>(
                      <th key={d} style={{padding:'6px 8px',textAlign:'center',fontSize:11,color:todayColIdx===i?'var(--accent)':'var(--text-muted)',fontWeight:700,textTransform:'uppercase',fontFamily:'var(--font-mono)',borderBottom:'1px solid var(--border)'}}>{d}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {['s','c'].map(session=>(
                    <React.Fragment key={session}>
                      <tr>
                        <td colSpan={7} style={{padding:'8px 10px 3px',fontSize:10,color:'var(--text-muted)',fontWeight:700,textTransform:'uppercase',fontFamily:'var(--font-mono)',letterSpacing:1}}>
                          {session==='s'?'☀️ Buổi sáng':'🌤️ Buổi chiều'}
                        </td>
                      </tr>
                      {TKB_SLOTS.filter(s=>s.startsWith(session)).map(slot=>{
                        const[sh,sm]=PERIODS[slot];
                        const isNowRow=currentSlot===slot;
                        return(
                          <tr key={slot} style={{background:isNowRow?'var(--accent-glow)':'transparent',transition:'background .3s'}}>
                            <td style={{padding:'3px 10px',whiteSpace:'nowrap'}}>
                              <span style={{fontFamily:'var(--font-mono)',fontWeight:700,fontSize:12,color:isNowRow?'var(--accent)':'var(--text-secondary)'}}>{SLOT_SHORT[slot]}</span>
                              <span style={{fontSize:10,color:'var(--text-muted)',marginLeft:6,fontFamily:'var(--font-mono)'}}>{fmtHM(sh,sm)}</span>
                            </td>
                            {TKB_DAYS.map((day,i)=>(
                              <td key={day} style={{padding:'3px 4px'}}>
                                <input type="text" value={tkb[slot][day]} placeholder="—"
                                  onChange={e=>handleTKBInput(slot,day,e.target.value)}
                                  style={{width:'100%',background:'transparent',border:'none',borderBottom:`1px solid ${todayColIdx===i?'var(--accent)':'var(--border)'}`,color:'var(--text-primary)',fontFamily:'var(--font-display)',fontSize:12,padding:'6px 4px',outline:'none',textAlign:'center',transition:'background .2s'}}
                                  onFocus={e=>e.target.style.background='var(--bg-elevated)'}
                                  onBlur={e=>e.target.style.background='transparent'}/>
                              </td>
                            ))}
                          </tr>
                        );
                      })}
                    </React.Fragment>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
            {[0,1].map(offset=>{
              const d=new Date(now);d.setDate(d.getDate()+offset);
              const dIdx=d.getDay();
              const colIdx=dIdx>=1&&dIdx<=6?dIdx-1:null;
              const label=offset===0?'📆 Hôm nay':'🗓️ Ngày mai';
              const dayName=dIdx===0?'Chủ Nhật':DAY_FULL[colIdx];
              const filledSlots=colIdx!==null?TKB_SLOTS.filter(s=>tkb[s]&&tkb[s][TKB_DAYS[colIdx]]):[];
              return(
                <div key={offset} className="card" style={{padding:'14px 16px'}}>
                  <div style={{fontWeight:700,color:'var(--text-primary)',marginBottom:10,fontSize:14,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <span>{label}</span>
                    <span style={{fontSize:11,color:'var(--text-muted)',fontFamily:'var(--font-mono)'}}>{dayName}</span>
                  </div>
                  {dIdx===0?(
                    <div style={{fontSize:13,color:'var(--text-muted)',padding:'8px 0'}}>🏖️ Chủ Nhật — Không có tiết học</div>
                  ):filledSlots.length===0?(
                    <div style={{fontSize:13,color:'var(--text-muted)',padding:'8px 0'}}>✨ Không có tiết học</div>
                  ):filledSlots.map(slot=>{
                    const[sh,sm]=PERIODS[slot];
                    const isNow=offset===0&&slot===currentSlot;
                    return(
                      <div key={slot} style={{display:'flex',alignItems:'center',gap:10,padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
                        <span style={{fontFamily:'var(--font-mono)',fontWeight:700,fontSize:11,padding:'2px 7px',borderRadius:6,flexShrink:0,background:isNow?'var(--accent)':'var(--bg-elevated)',color:isNow?'#fff':'var(--text-secondary)'}}>{SLOT_SHORT[slot]}</span>
                        <span style={{fontSize:11,color:'var(--text-muted)',fontFamily:'var(--font-mono)',flexShrink:0}}>{fmtHM(sh,sm)}</span>
                        <span style={{fontSize:13,fontWeight:600,color:isNow?'var(--accent)':'var(--text-primary)',flex:1}}>{tkb[slot][TKB_DAYS[colIdx]]}</span>
                        {isNow&&<span style={{fontSize:10,color:'var(--accent)',fontWeight:700,fontFamily:'var(--font-mono)',flexShrink:0}}>▶ NOW</span>}
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
};

// ─────────────────────────────────────────────────────
//  NOTES PAGE
// ─────────────────────────────────────────────────────
const NotesPage=({notes,setNotes,algorithms,onOpenAlgo,customNotes,setCustomNotes})=>{
  const toast=useToast();
  const [showAddModal,setShowAddModal]=React.useState(false);
  const [editingNote,setEditingNote]=React.useState(null);
  const [newTitle,setNewTitle]=React.useState('');
  const [newContent,setNewContent]=React.useState('');
  const [newPosition,setNewPosition]=React.useState('');
  const [activeTab,setActiveTab]=React.useState('all');
  const [searchQ,setSearchQ]=React.useState('');

  const saveCustomNotes=(updated)=>{setCustomNotes(updated);LS.set('custom_notes',updated);};

  const openAdd=()=>{setEditingNote(null);setNewTitle('');setNewContent('');setNewPosition('');setShowAddModal(true);};
  const openEdit=(note)=>{setEditingNote(note);setNewTitle(note.title);setNewContent(note.content);setNewPosition(note.position||'');setShowAddModal(true);};

  const saveNote=()=>{
    if(!newTitle.trim()){toast('⚠️ Vui lòng nhập tên note','warning');return;}
    const now=new Date().toISOString();
    if(editingNote){
      saveCustomNotes(customNotes.map(n=>n.id===editingNote.id?{...n,title:newTitle.trim(),content:newContent,position:newPosition.trim(),updatedAt:now}:n));
      toast('✅ Đã cập nhật note!','success');
    }else{
      saveCustomNotes([...customNotes,{id:'cn_'+Date.now(),title:newTitle.trim(),content:newContent,position:newPosition.trim(),createdAt:now,updatedAt:now}]);
      toast('✅ Đã tạo note mới!','success');
    }
    setShowAddModal(false);
  };

  const deleteCustomNote=(id)=>{
    if(!window.confirm('Xóa note này?'))return;
    saveCustomNotes(customNotes.filter(n=>n.id!==id));
    toast('🗑️ Đã xóa note','info');
  };

  const moveNote=(id,dir)=>{
    const idx=customNotes.findIndex(n=>n.id===id);
    if(idx<0)return;
    const arr=[...customNotes];const swap=idx+dir;
    if(swap<0||swap>=arr.length)return;
    [arr[idx],arr[swap]]=[arr[swap],arr[idx]];saveCustomNotes(arr);
  };

  const algoNotesList=React.useMemo(()=>
    Object.entries(notes).filter(([,c])=>c&&c.trim()).map(([id,content])=>{
      const algo=algorithms.find(a=>a.id===parseInt(id));return{id,content,algo};
    }).filter(n=>n.algo)
  ,[notes,algorithms]);

  const filteredCustom=customNotes.filter(n=>!searchQ||n.title.toLowerCase().includes(searchQ.toLowerCase())||n.content.toLowerCase().includes(searchQ.toLowerCase())||(n.position||'').toLowerCase().includes(searchQ.toLowerCase()));
  const filteredAlgo=algoNotesList.filter(n=>!searchQ||n.algo.name.toLowerCase().includes(searchQ.toLowerCase())||n.content.toLowerCase().includes(searchQ.toLowerCase()));

  const inputStyle={width:'100%',background:'var(--bg-base)',border:'1px solid var(--border)',borderRadius:8,padding:'9px 12px',color:'var(--text-primary)',fontFamily:'var(--font-display)',fontSize:14,outline:'none'};

  return(
    <div className="animate-fade">
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <h1 style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:24,color:'var(--text-primary)'}}>📝 Ghi Chú</h1>
        <button onClick={openAdd} className="btn-primary" style={{display:'flex',alignItems:'center',gap:6}}>
          <Icon name="plus" size={14}/> Tạo Note Mới
        </button>
      </div>

      <div className="relative mb-4">
        <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'var(--text-muted)'}}><Icon name="search" size={15}/></span>
        <input value={searchQ} onChange={e=>setSearchQ(e.target.value)} placeholder="Tìm kiếm ghi chú..."
          style={{width:'100%',background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:10,padding:'10px 14px 10px 38px',color:'var(--text-primary)',fontFamily:'var(--font-display)',fontSize:14,outline:'none'}}
          onFocus={e=>e.target.style.borderColor='var(--accent)'}
          onBlur={e=>e.target.style.borderColor='var(--border)'}/>
      </div>

      <div style={{display:'flex',gap:0,marginBottom:20,background:'var(--bg-elevated)',borderRadius:10,padding:4,width:'fit-content',border:'1px solid var(--border)'}}>
        {[['all',`Tất cả (${filteredCustom.length+filteredAlgo.length})`],['custom',`📌 Riêng (${filteredCustom.length})`],['algo',`🔗 Algo (${filteredAlgo.length})`]].map(([k,l])=>(
          <button key={k} onClick={()=>setActiveTab(k)}
            style={{padding:'7px 14px',borderRadius:7,border:'none',fontFamily:'var(--font-display)',fontWeight:700,fontSize:12,cursor:'pointer',transition:'all .2s',whiteSpace:'nowrap',
              background:activeTab===k?'var(--accent)':'transparent',color:activeTab===k?'#fff':'var(--text-secondary)'}}>{l}</button>
        ))}
      </div>

      {(activeTab==='all'||activeTab==='custom')&&(
        <div className="mb-6">
          {activeTab==='all'&&<div style={{fontSize:12,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:1,marginBottom:10}}>📌 GHI CHÚ RIÊNG</div>}
          {filteredCustom.length===0?(
            <div className="card p-8 text-center" style={{color:'var(--text-muted)'}}>
              <div style={{fontSize:32,marginBottom:8}}>📭</div>
              <div style={{fontSize:14,fontWeight:600}}>Chưa có ghi chú riêng</div>
            </div>
          ):(
            <div className="space-y-3">
              {filteredCustom.map((note)=>(
                <div key={note.id} className="card p-4" style={{borderLeft:'3px solid var(--accent2)'}}>
                  <div className="flex items-start justify-between gap-3 mb-2">
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,fontSize:15,color:'var(--text-primary)',marginBottom:2}}>{note.title}</div>
                      {note.position&&<span className="tag" style={{background:'rgba(167,139,250,.15)',color:'#a78bfa',marginBottom:4}}>📍 {note.position}</span>}
                    </div>
                    <div className="flex items-center gap-1">
                      <button onClick={()=>moveNote(note.id,-1)} className="btn-ghost" style={{padding:'4px 7px'}}><Icon name="move-up" size={13}/></button>
                      <button onClick={()=>moveNote(note.id,1)} className="btn-ghost" style={{padding:'4px 7px'}}><Icon name="move-down" size={13}/></button>
                      <button onClick={()=>openEdit(note)} className="btn-ghost" style={{padding:'4px 7px'}}><Icon name="edit" size={13}/></button>
                      <button onClick={()=>deleteCustomNote(note.id)} className="btn-ghost" style={{padding:'4px 7px',color:'var(--danger)'}}><Icon name="trash" size={13}/></button>
                    </div>
                  </div>
                  {note.content&&<div style={{fontSize:13,color:'var(--text-secondary)',whiteSpace:'pre-wrap',wordBreak:'break-word',fontFamily:'var(--font-mono)',lineHeight:1.6,maxHeight:120,overflow:'hidden',maskImage:'linear-gradient(to bottom,black 60%,transparent 100%)'}}>{note.content}</div>}
                  <div style={{fontSize:11,color:'var(--text-muted)',marginTop:8}}>Cập nhật: {new Date(note.updatedAt).toLocaleString('vi-VN')}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {(activeTab==='all'||activeTab==='algo')&&(
        <div>
          {activeTab==='all'&&<div style={{fontSize:12,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:1,marginBottom:10}}>🔗 GHI CHÚ THUẬT TOÁN</div>}
          {filteredAlgo.length===0?(
            <div className="card p-8 text-center" style={{color:'var(--text-muted)'}}>
              <div style={{fontSize:32,marginBottom:8}}>📭</div>
              <div style={{fontSize:14,fontWeight:600}}>Chưa có ghi chú thuật toán nào</div>
            </div>
          ):(
            <div className="space-y-3">
              {filteredAlgo.map(({id,content,algo})=>(
                <div key={id} className="card p-4 cursor-pointer" style={{borderLeft:'3px solid var(--accent)'}} onClick={()=>onOpenAlgo&&onOpenAlgo(algo)}>
                  <div className="flex items-start justify-between gap-3 mb-2">
                    <div>
                      <div className="flex items-center gap-2 flex-wrap mb-1">
                        <span className={`tag ${CAT_COLORS[algo.category]||'cat-0'}`}>{algo.category}</span>
                        <Stars n={algo.stars}/>
                      </div>
                      <div style={{fontWeight:700,fontSize:14,color:'var(--text-primary)'}}>{algo.name}</div>
                    </div>
                    <Icon name="external-link" size={13} style={{color:'var(--text-muted)',flexShrink:0,marginTop:4}}/>
                  </div>
                  <div style={{fontSize:13,color:'var(--text-secondary)',whiteSpace:'pre-wrap',wordBreak:'break-word',fontFamily:'var(--font-mono)',lineHeight:1.6,maxHeight:100,overflow:'hidden',maskImage:'linear-gradient(to bottom,black 50%,transparent 100%)'}}>{content}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {showAddModal&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.7)',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}
          onClick={e=>e.target===e.currentTarget&&setShowAddModal(false)}>
          <div className="card animate-fade" style={{width:'100%',maxWidth:560,padding:28}}>
            <div className="flex items-center justify-between mb-5">
              <h2 style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:18,color:'var(--text-primary)'}}>{editingNote?'✏️ Chỉnh sửa Note':'✨ Tạo Note Mới'}</h2>
              <button onClick={()=>setShowAddModal(false)} className="btn-ghost" style={{padding:'6px 10px'}}><Icon name="x" size={16}/></button>
            </div>
            <div className="space-y-4">
              <div>
                <label style={{fontSize:12,color:'var(--text-muted)',display:'block',marginBottom:5,fontWeight:700}}>TÊN NOTE *</label>
                <input value={newTitle} onChange={e=>setNewTitle(e.target.value)} placeholder="Nhập tên note..." style={inputStyle}
                  onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='var(--border)'}/>
              </div>
              <div>
                <label style={{fontSize:12,color:'var(--text-muted)',display:'block',marginBottom:5,fontWeight:700}}>VỊ TRÍ / NHÃN (tuỳ chọn)</label>
                <input value={newPosition} onChange={e=>setNewPosition(e.target.value)} placeholder="VD: Phần 1, Quan trọng..." style={inputStyle}
                  onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='var(--border)'}/>
              </div>
              <div>
                <label style={{fontSize:12,color:'var(--text-muted)',display:'block',marginBottom:5,fontWeight:700}}>NỘI DUNG</label>
                <textarea value={newContent} onChange={e=>setNewContent(e.target.value)} placeholder="Nhập nội dung ghi chú..." rows={7}
                  style={{...inputStyle,fontFamily:'var(--font-mono)',fontSize:13,resize:'vertical',lineHeight:1.6}}
                  onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='var(--border)'}/>
              </div>
              <div className="flex gap-2 justify-end">
                <button onClick={()=>setShowAddModal(false)} className="btn-ghost">Hủy</button>
                <button onClick={saveNote} className="btn-primary" style={{display:'flex',alignItems:'center',gap:6}}>
                  <Icon name="save" size={14}/> {editingNote?'Cập nhật':'Tạo Note'}
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// ─────────────────────────────────────────────────────
//  SETTINGS
// ─────────────────────────────────────────────────────
const Settings=({darkMode,setDarkMode,completed,setCompleted,notes,setNotes,customNotes,setCustomNotes})=>{
  const toast=useToast();
  const completedCount=Object.values(completed).filter(Boolean).length;
  const notedCount=Object.keys(notes).length;
  const [showExportModal,setShowExportModal]=React.useState(false);
  const [showImportModal,setShowImportModal]=React.useState(false);
  const [exportFormat,setExportFormat]=React.useState('json');
  const [exportSections,setExportSections]=React.useState({completed:true,notes:true,customNotes:true,schedule:true,tkb:true});
  const [importMode,setImportMode]=React.useState('merge');
  const [importFormat,setImportFormat]=React.useState('json');
  const [importPreview,setImportPreview]=React.useState(null);
  const [pendingImport,setPendingImport]=React.useState(null);
  const importFileRef=React.useRef();

  const resetProgress=()=>{if(!window.confirm('Xóa toàn bộ tiến độ?'))return;setCompleted({});LS.set('completed',{});toast('🗑️ Đã xóa tiến độ','warning');};
  const resetNotes=()=>{if(!window.confirm('Xóa toàn bộ ghi chú?'))return;setNotes({});LS.set('algo_notes',{});toast('🗑️ Đã xóa ghi chú','warning');};

  const toggleExportSection=(key)=>setExportSections(prev=>({...prev,[key]:!prev[key]}));

  const buildExportData=()=>{
    const data={exportedAt:new Date().toISOString(),version:3};
    if(exportSections.completed)data.completed=completed;
    if(exportSections.notes)data.notes=notes;
    if(exportSections.customNotes)data.customNotes=customNotes;
    if(exportSections.schedule){try{data.schedule=JSON.parse(localStorage.getItem('schedule')||'null');}catch{}}
    if(exportSections.tkb){try{data.tkb=JSON.parse(localStorage.getItem('algo_tkb_v1')||'null');}catch{}}
    return data;
  };

  const doExport=()=>{
    const data=buildExportData();
    if(!Object.values(exportSections).some(Boolean)){toast('⚠️ Chọn ít nhất 1 phần','warning');return;}
    let content,filename,type;
    if(exportFormat==='json'){
      content=JSON.stringify(data,null,2);filename=`algomaster-${new Date().toISOString().slice(0,10)}.json`;type='application/json';
    }else{
      const ts=new Date().toISOString();
      content=`-- AlgoMaster Export SQL\n-- ${ts}\nCREATE TABLE IF NOT EXISTS am_export(key TEXT PRIMARY KEY,value TEXT,exported_at TEXT);\nDELETE FROM am_export;\n`
        +Object.entries(data).filter(([k])=>k!=='exportedAt'&&k!=='version').map(([k,v])=>`INSERT INTO am_export VALUES('${k}','${JSON.stringify(v).replace(/'/g,"''")}','${ts}');`).join('\n');
      filename=`algomaster-${new Date().toISOString().slice(0,10)}.sql`;type='text/plain';
    }
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([content],{type}));a.download=filename;a.click();
    toast(`📦 Đã xuất ${exportFormat.toUpperCase()}!`,'success');setShowExportModal(false);
  };

  const parseImportFile=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        let data;
        if(importFormat==='json'){data=JSON.parse(ev.target.result);}
        else{
          data={};const text=ev.target.result;
          const regex=/INSERT INTO am_export[^)]*\)\s*VALUES\s*\('([^']+)',\s*'((?:[^']|'')*)',/g;
          let m;while((m=regex.exec(text))!==null){try{data[m[1]]=JSON.parse(m[2].replace(/''/g,"'"));}catch{}}
          if(!Object.keys(data).length)throw new Error('Không tìm thấy dữ liệu trong SQL');
        }
        const preview=[];
        if(data.completed)preview.push(`✓ Tiến độ: ${Object.values(data.completed).filter(Boolean).length} đã học`);
        if(data.notes)preview.push(`📝 Ghi chú algo: ${Object.keys(data.notes).length} note`);
        if(data.customNotes)preview.push(`📌 Ghi chú riêng: ${data.customNotes.length} note`);
        if(data.schedule)preview.push('📅 Lịch học: có dữ liệu');
        if(data.tkb)preview.push('🏫 TKB: có dữ liệu');
        setImportPreview(preview);setPendingImport(data);
      }catch(err){toast('❌ File không hợp lệ: '+err.message,'error');setImportPreview(null);setPendingImport(null);}
    };
    reader.readAsText(file);
  };

  const doImport=()=>{
    if(!pendingImport)return;
    const data=pendingImport,isReplace=importMode==='replace';
    if(data.completed){const u=isReplace?data.completed:{...completed,...data.completed};setCompleted(u);LS.set('completed',u);}
    if(data.notes){const u=isReplace?data.notes:{...notes,...data.notes};setNotes(u);LS.set('algo_notes',u);}
    if(data.customNotes){const u=isReplace?data.customNotes:[...customNotes,...data.customNotes.filter(n=>!customNotes.find(c=>c.id===n.id))];setCustomNotes(u);LS.set('custom_notes',u);}
    if(data.schedule)localStorage.setItem('schedule',JSON.stringify(data.schedule));
    if(data.tkb)localStorage.setItem('algo_tkb_v1',JSON.stringify(data.tkb));
    toast(`✅ Đã nhập (${isReplace?'Thay thế':'Gộp'})!`,'success');
    setShowImportModal(false);setPendingImport(null);setImportPreview(null);
    if(importFileRef.current)importFileRef.current.value='';
  };

  const sectionLabels={completed:'✓ Tiến độ học tập',notes:'📝 Ghi chú thuật toán',customNotes:'📌 Ghi chú riêng',schedule:'📅 Lịch học',tkb:'🏫 Thời khóa biểu'};
  const btnTab=(active)=>({padding:'7px 14px',borderRadius:7,border:'none',cursor:'pointer',fontFamily:'var(--font-display)',fontWeight:700,fontSize:13,transition:'all .2s',background:active?'var(--accent)':'transparent',color:active?'#fff':'var(--text-secondary)'});
  const modalOverlay={position:'fixed',inset:0,background:'rgba(0,0,0,.75)',zIndex:400,display:'flex',alignItems:'center',justifyContent:'center',padding:16};

  return(
    <div className="animate-fade max-w-xl">
      <h1 style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:24,color:'var(--text-primary)',marginBottom:24}}>⚙️ Cài đặt</h1>
      <div className="space-y-4">
        <div className="card p-5">
          <h3 style={{fontWeight:700,color:'var(--text-primary)',marginBottom:12}}>🎨 Giao diện</h3>
          <div className="flex items-center justify-between">
            <span style={{fontSize:14,color:'var(--text-secondary)'}}>Chế độ {darkMode?'Tối (Dark)':'Sáng (Light)'}</span>
            <button onClick={()=>setDarkMode(d=>!d)} className="btn-primary" style={{display:'flex',alignItems:'center',gap:6}}>
              <Icon name={darkMode?'sun':'moon'} size={14}/> Chuyển sang {darkMode?'Light':'Dark'}
            </button>
          </div>
        </div>

        <div className="card p-5">
          <h3 style={{fontWeight:700,color:'var(--text-primary)',marginBottom:12}}>📊 Thống kê</h3>
          <div className="grid grid-cols-2 gap-3">
            <div className="card-elevated p-3 text-center">
              <div style={{fontFamily:'var(--font-mono)',fontWeight:800,fontSize:24,color:'var(--success)'}}>{completedCount}</div>
              <div style={{fontSize:12,color:'var(--text-muted)',marginTop:2}}>Đã hoàn thành</div>
            </div>
            <div className="card-elevated p-3 text-center">
              <div style={{fontFamily:'var(--font-mono)',fontWeight:800,fontSize:24,color:'var(--accent2)'}}>{notedCount}</div>
              <div style={{fontSize:12,color:'var(--text-muted)',marginTop:2}}>Ghi chú thuật toán</div>
            </div>
          </div>
        </div>

        <div className="card p-5">
          <h3 style={{fontWeight:700,color:'var(--text-primary)',marginBottom:12}}>💾 Quản lý dữ liệu</h3>
          <div className="space-y-3">
            <button onClick={()=>setShowExportModal(true)} className="btn-primary w-full" style={{display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
              <Icon name="download" size={14}/> Xuất dữ liệu (JSON / SQL)
            </button>
            <button onClick={()=>setShowImportModal(true)} className="btn-ghost w-full" style={{display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
              <Icon name="upload" size={14}/> Nhập dữ liệu (JSON / SQL)
            </button>
          </div>
        </div>

        <div className="card p-5" style={{borderColor:'rgba(248,113,113,.3)'}}>
          <h3 style={{fontWeight:700,color:'var(--danger)',marginBottom:12}}>⚠️ Khu vực nguy hiểm</h3>
          <div className="space-y-3">
            <button onClick={resetProgress} className="btn-ghost w-full" style={{color:'var(--danger)',borderColor:'var(--danger)',display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
              <Icon name="trash" size={14}/> Xóa tiến độ học tập
            </button>
            <button onClick={resetNotes} className="btn-ghost w-full" style={{color:'var(--danger)',borderColor:'var(--danger)',display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
              <Icon name="trash" size={14}/> Xóa tất cả ghi chú thuật toán
            </button>
          </div>
        </div>

        <div className="card-elevated p-5 text-center">
          <div style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:18,color:'var(--accent)',marginBottom:4}}>AlgoMaster Planner v3.1</div>
          <div style={{fontSize:12,color:'var(--text-muted)'}}>Dữ liệu từ <a href="https://wiki.vnoi.info" target="_blank" style={{color:'var(--accent)'}}>VNOI Wiki</a> · 127 thuật toán</div>
          <div style={{fontSize:11,color:'var(--text-muted)',marginTop:4}}>Dữ liệu lưu tại LocalStorage · Pomodoro timer background-capable</div>
        </div>
      </div>

      {/* Export Modal */}
      {showExportModal&&(
        <div style={modalOverlay} onClick={e=>e.target===e.currentTarget&&setShowExportModal(false)}>
          <div className="card animate-fade" style={{width:'100%',maxWidth:500,padding:28}}>
            <div className="flex items-center justify-between mb-5">
              <h2 style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:18,color:'var(--text-primary)'}}>📦 Xuất dữ liệu</h2>
              <button onClick={()=>setShowExportModal(false)} className="btn-ghost" style={{padding:'6px 10px'}}><Icon name="x" size={16}/></button>
            </div>
            <div className="mb-4">
              <div style={{fontSize:12,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',marginBottom:8}}>Định dạng</div>
              <div style={{display:'flex',gap:0,background:'var(--bg-elevated)',borderRadius:8,padding:3,border:'1px solid var(--border)'}}>
                <button style={btnTab(exportFormat==='json')} onClick={()=>setExportFormat('json')}>📄 JSON</button>
                <button style={btnTab(exportFormat==='sql')} onClick={()=>setExportFormat('sql')}>🗄️ SQL</button>
              </div>
            </div>
            <div className="mb-5">
              <div style={{fontSize:12,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',marginBottom:8}}>Chọn phần dữ liệu</div>
              <div className="space-y-2">
                {Object.entries(sectionLabels).map(([key,label])=>(
                  <label key={key} style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer',padding:'8px 12px',borderRadius:8,border:'1px solid',borderColor:exportSections[key]?'var(--accent)':'var(--border)',background:exportSections[key]?'var(--accent-glow)':'var(--bg-elevated)',transition:'all .2s'}}>
                    <input type="checkbox" checked={exportSections[key]} onChange={()=>toggleExportSection(key)} style={{accentColor:'var(--accent)',width:15,height:15}}/>
                    <span style={{fontSize:14,fontWeight:600,color:exportSections[key]?'var(--accent)':'var(--text-secondary)'}}>{label}</span>
                  </label>
                ))}
              </div>
            </div>
            <div className="flex gap-2 justify-end">
              <button onClick={()=>setShowExportModal(false)} className="btn-ghost">Hủy</button>
              <button onClick={doExport} className="btn-primary" style={{display:'flex',alignItems:'center',gap:6}}>
                <Icon name="download" size={14}/> Xuất {exportFormat.toUpperCase()}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Import Modal */}
      {showImportModal&&(
        <div style={modalOverlay} onClick={e=>e.target===e.currentTarget&&setShowImportModal(false)}>
          <div className="card animate-fade" style={{width:'100%',maxWidth:500,padding:28}}>
            <div className="flex items-center justify-between mb-5">
              <h2 style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:18,color:'var(--text-primary)'}}>📥 Nhập dữ liệu</h2>
              <button onClick={()=>setShowImportModal(false)} className="btn-ghost" style={{padding:'6px 10px'}}><Icon name="x" size={16}/></button>
            </div>
            <div className="mb-4">
              <div style={{fontSize:12,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',marginBottom:8}}>Định dạng file</div>
              <div style={{display:'flex',gap:0,background:'var(--bg-elevated)',borderRadius:8,padding:3,border:'1px solid var(--border)'}}>
                <button style={btnTab(importFormat==='json')} onClick={()=>{setImportFormat('json');setPendingImport(null);setImportPreview(null);}}>📄 JSON</button>
                <button style={btnTab(importFormat==='sql')} onClick={()=>{setImportFormat('sql');setPendingImport(null);setImportPreview(null);}}>🗄️ SQL</button>
              </div>
            </div>
            <div className="mb-4">
              <div style={{fontSize:12,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',marginBottom:8}}>Chế độ nhập</div>
              <div className="space-y-2">
                {[['merge','🔀 Gộp (Merge)','Thêm dữ liệu mới, giữ lại dữ liệu cũ.'],['replace','🔄 Thay thế (Replace)','Ghi đè hoàn toàn lên dữ liệu cũ.']].map(([k,l,d])=>(
                  <label key={k} style={{display:'flex',alignItems:'flex-start',gap:10,cursor:'pointer',padding:'10px 12px',borderRadius:8,border:'1px solid',borderColor:importMode===k?'var(--accent)':'var(--border)',background:importMode===k?'var(--accent-glow)':'var(--bg-elevated)',transition:'all .2s'}} onClick={()=>setImportMode(k)}>
                    <input type="radio" checked={importMode===k} onChange={()=>setImportMode(k)} style={{accentColor:'var(--accent)',marginTop:2,width:14,height:14}}/>
                    <div>
                      <div style={{fontSize:14,fontWeight:700,color:importMode===k?'var(--accent)':'var(--text-primary)'}}>{l}</div>
                      <div style={{fontSize:12,color:'var(--text-muted)',marginTop:2}}>{d}</div>
                    </div>
                  </label>
                ))}
              </div>
            </div>
            <div className="mb-4">
              <div style={{fontSize:12,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',marginBottom:8}}>Chọn file</div>
              <label style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,padding:'12px',borderRadius:8,border:'2px dashed var(--border)',cursor:'pointer',color:'var(--text-secondary)',fontSize:13,fontWeight:600,transition:'border-color .2s'}}
                onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent)'}
                onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
                <Icon name="upload" size={16}/> Chọn file .{importFormat}...
                <input ref={importFileRef} type="file" accept={`.${importFormat}`} style={{display:'none'}} onChange={parseImportFile}/>
              </label>
            </div>
            {importPreview&&(
              <div className="card-elevated p-3 mb-4 animate-fade">
                <div style={{fontSize:12,fontWeight:700,color:'var(--success)',marginBottom:6}}>✅ File hợp lệ — Nội dung sẽ nhập:</div>
                {importPreview.map((line,i)=><div key={i} style={{fontSize:13,color:'var(--text-secondary)',marginTop:3}}>• {line}</div>)}
                <div style={{fontSize:12,color:'var(--warning)',marginTop:8,padding:'6px 8px',background:'rgba(251,191,36,.1)',borderRadius:5,border:'1px solid rgba(251,191,36,.3)'}}>
                  ⚠️ Chế độ: <strong>{importMode==='merge'?'Gộp — dữ liệu cũ được giữ lại':'Thay thế — dữ liệu cũ sẽ bị ghi đè'}</strong>
                </div>
              </div>
            )}
            <div className="flex gap-2 justify-end">
              <button onClick={()=>{setShowImportModal(false);setPendingImport(null);setImportPreview(null);}} className="btn-ghost">Hủy</button>
              <button onClick={doImport} disabled={!pendingImport} className="btn-primary"
                style={{display:'flex',alignItems:'center',gap:6,opacity:pendingImport?1:.4,cursor:pendingImport?'pointer':'not-allowed'}}>
                <Icon name="upload" size={14}/> Xác nhận nhập
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// ─────────────────────────────────────────────────────
//  MAIN APP
// ─────────────────────────────────────────────────────
const App=()=>{
  const [page,setPage]=React.useState('dashboard');
  const [darkMode,setDarkMode]=React.useState(()=>LS.get('darkMode',true));
  const [completed,setCompleted]=React.useState(()=>LS.get('completed',{}));

			padding: 10px 14px;

			justify-content: space-between;
			gap: 10px;

		/* ─── TOAST ─── */
		.toast {
			position: fixed;
			bottom: 24px;
			right: 24px;
			background: var(--card);
			border-radius: 16px;
			padding: 14px 20px;
			box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);

		}

			background: #4d4070;
		}
