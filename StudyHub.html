<style>
:root{color-scheme:dark;--bg:#070a13;--panel:rgba(15,23,42,.88);--border:rgba(148,163,184,.24);--text:#e5e7eb;--muted:#94a3b8;--accent:#38bdf8;--ok:#22c55e;--danger:#fb7185;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 10% 0%,rgba(56,189,248,.18),transparent 34%),radial-gradient(circle at 85% 5%,rgba(167,139,250,.18),transparent 32%),linear-gradient(135deg,#070a13 0%,#0f172a 46%,#111827 100%);color:var(--text)}body{overflow:hidden}.studyhub-shell{height:100vh;display:flex;flex-direction:column}.studyhub-topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border-bottom:1px solid var(--border);background:rgba(2,6,23,.76);backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(0,0,0,.25);z-index:10}.studyhub-brand{display:flex;flex-direction:column;min-width:150px}.studyhub-brand strong{font-size:17px;line-height:1.2}.studyhub-brand span{color:var(--muted);font-size:12px;margin-top:2px}.studyhub-tabs{display:flex;align-items:center;gap:8px;min-width:0;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}.studyhub-tab{border:1px solid var(--border);background:rgba(15,23,42,.74);color:var(--muted);border-radius:8px;min-height:38px;padding:0 14px;cursor:pointer;font-weight:700;white-space:nowrap;transition:border-color .16s,background .16s,color .16s,transform .16s}.studyhub-tab:hover{color:var(--text);border-color:rgba(56,189,248,.45);transform:translateY(-1px)}.studyhub-tab.active{color:white;border-color:rgba(56,189,248,.74);background:linear-gradient(135deg,rgba(14,165,233,.34),rgba(124,58,237,.3));box-shadow:0 0 0 1px rgba(56,189,248,.12) inset}.studyhub-main{position:relative;flex:1;min-height:0}.studyhub-panel{position:absolute;inset:0;display:none;min-height:0}.studyhub-panel.active{display:block}.app-frame{width:100%;height:100%;border:0;display:block;background:#020617}.sr-panel{height:100%;overflow:auto;padding:22px}.sr-wrap{width:min(1180px,100%);margin:0 auto;display:grid;gap:18px}.sr-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px;border:1px solid var(--border);border-radius:8px;background:linear-gradient(135deg,rgba(14,165,233,.18),rgba(124,58,237,.16)),rgba(15,23,42,.72);box-shadow:0 20px 60px rgba(0,0,0,.35)}.sr-title h1{margin:0;font-size:clamp(24px,3vw,38px);line-height:1.05}.sr-title p{margin:8px 0 0;color:var(--muted);max-width:760px;line-height:1.55}.sr-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.sr-btn{border:1px solid var(--border);border-radius:8px;min-height:40px;padding:0 14px;color:var(--text);background:rgba(15,23,42,.82);font-weight:800;cursor:pointer;transition:transform .16s,border-color .16s,background .16s}.sr-btn:hover{transform:translateY(-1px);border-color:rgba(56,189,248,.55)}.sr-btn.primary{border-color:rgba(56,189,248,.65);background:linear-gradient(135deg,#0284c7,#7c3aed);color:white}.sr-btn.success{border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.16);color:#bbf7d0}.sr-btn.danger{border-color:rgba(251,113,133,.45);background:rgba(244,63,94,.12);color:#fecdd3}.sr-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.sr-stat,.sr-card,.sr-list-section{border:1px solid var(--border);border-radius:8px;background:var(--panel);box-shadow:0 16px 44px rgba(0,0,0,.22)}.sr-stat{padding:16px}.sr-stat span{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}.sr-stat strong{font-size:30px;line-height:1}.sr-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}.sr-list-section{overflow:hidden}.sr-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);background:rgba(2,6,23,.36)}.sr-section-head h2{margin:0;font-size:17px}.sr-pill{display:inline-flex;align-items:center;min-height:26px;border:1px solid var(--border);border-radius:999px;padding:0 10px;color:var(--muted);background:rgba(15,23,42,.74);font-size:12px;font-weight:800;white-space:nowrap}.sr-list{display:grid;gap:12px;padding:14px}.sr-empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed rgba(148,163,184,.28);border-radius:8px;background:rgba(15,23,42,.36)}.sr-card{padding:14px;display:grid;gap:11px}.sr-card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.sr-card-title{min-width:0}.sr-card-title h3{margin:0;font-size:16px;line-height:1.35;overflow-wrap:anywhere}.sr-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:12px}.sr-content{color:#dbeafe;line-height:1.55;white-space:normal;overflow-wrap:anywhere;border-left:3px solid rgba(56,189,248,.5);padding:2px 0 2px 11px}.sr-content p{margin:0 0 8px}.sr-content p:last-child{margin-bottom:0}.sr-content code{background:rgba(2,6,23,.68);border:1px solid rgba(148,163,184,.22);border-radius:6px;padding:1px 5px;color:#fde68a}.sr-content strong{color:#fff}.sr-content em{color:#bae6fd}.sr-card-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.sr-due-now{color:#bbf7d0}.sr-future{color:#bfdbfe}.sr-modal-backdrop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(2,6,23,.72);backdrop-filter:blur(14px);z-index:30}.sr-modal-backdrop.open{display:flex}.sr-modal{width:min(640px,100%);border:1px solid rgba(148,163,184,.32);border-radius:8px;background:#0f172a;box-shadow:0 28px 80px rgba(0,0,0,.55);overflow:hidden}.sr-modal header{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}.sr-modal h2{margin:0;font-size:19px}.sr-form{display:grid;gap:14px;padding:18px}.sr-field{display:grid;gap:7px}.sr-field label{color:#cbd5e1;font-weight:800;font-size:13px}.sr-field input,.sr-field textarea{width:100%;border:1px solid rgba(148,163,184,.3);border-radius:8px;background:rgba(2,6,23,.62);color:var(--text);font:inherit;padding:11px 12px;outline:none}.sr-field input:focus,.sr-field textarea:focus{border-color:rgba(56,189,248,.8);box-shadow:0 0 0 3px rgba(56,189,248,.13)}.sr-field textarea{min-height:160px;resize:vertical;line-height:1.5}.sr-modal footer{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:rgba(2,6,23,.24)}@media(max-width:860px){body{overflow:auto}.studyhub-shell{min-height:100vh;height:auto}.studyhub-topbar{align-items:stretch;flex-direction:column}.studyhub-main{height:calc(100vh - 122px);min-height:620px}.sr-panel{padding:14px}.sr-hero{align-items:stretch;flex-direction:column}.sr-actions{justify-content:flex-start}.sr-stats,.sr-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="studyhub-shell"><header class="studyhub-topbar"><div class="studyhub-brand"><strong>StudyHub</strong><span>AlgoMaster + XPS + Spaced Repetition</span></div><nav class="studyhub-tabs" aria-label="StudyHub tabs"><button class="studyhub-tab active" type="button" data-tab="algo">⚡ AlgoMaster</button><button class="studyhub-tab" type="button" data-tab="xps">📚 XPS Planner</button><button class="studyhub-tab" type="button" data-tab="sr">🧠 Ghi nhớ có hệ thống</button></nav></header><main class="studyhub-main"><section class="studyhub-panel active" id="panel-algo" aria-label="AlgoMaster"><iframe class="app-frame" id="algo-frame" title="AlgoMaster"></iframe></section><section class="studyhub-panel" id="panel-xps" aria-label="XPS Planner"><iframe class="app-frame" id="xps-frame" title="XPS Planner"></iframe></section><section class="studyhub-panel" id="panel-sr" aria-label="Ghi nhớ có hệ thống"><div class="sr-panel"><div class="sr-wrap"><section class="sr-hero"><div class="sr-title"><h1>🧠 Ghi nhớ có hệ thống</h1><p>Flashcard tự lên lịch ôn tập theo lặp lại ngắt quãng, lưu cục bộ trong trình duyệt để dùng cùng StudyHub.</p></div><div class="sr-actions"><button class="sr-btn primary" type="button" id="sr-new-card">➕ Tạo thẻ mới</button></div></section><section class="sr-stats" aria-label="Thống kê flashcard"><div class="sr-stat"><span>Tổng số thẻ</span><strong id="sr-total">0</strong></div><div class="sr-stat"><span>Cần ôn hôm nay</span><strong id="sr-due-count">0</strong></div><div class="sr-stat"><span>Sẽ ôn trong tương lai</span><strong id="sr-future-count">0</strong></div></section><section class="sr-grid"><div class="sr-list-section"><div class="sr-section-head"><h2>Đến hạn ôn</h2><span class="sr-pill" id="sr-due-pill">0 thẻ</span></div><div class="sr-list" id="sr-due-list"></div></div><div class="sr-list-section"><div class="sr-section-head"><h2>Lịch ôn tương lai</h2><span class="sr-pill" id="sr-future-pill">0 thẻ</span></div><div class="sr-list" id="sr-future-list"></div></div></section></div></div></section></main></div>
<div class="sr-modal-backdrop" id="sr-modal" role="dialog" aria-modal="true" aria-labelledby="sr-modal-title"><div class="sr-modal"><header><h2 id="sr-modal-title">Tạo thẻ ghi nhớ</h2><button class="sr-btn" type="button" id="sr-close-modal">Đóng</button></header><form class="sr-form" id="sr-form"><div class="sr-field"><label for="sr-title-input">Tiêu đề</label><input id="sr-title-input" name="title" autocomplete="off" required maxlength="160" placeholder="Ví dụ: Định lý Bayes"></div><div class="sr-field"><label for="sr-content-input">Nội dung</label><textarea id="sr-content-input" name="content" required placeholder="Hỗ trợ xuống dòng, **đậm**, *nghiêng*, và code."></textarea></div></form><footer><button class="sr-btn" type="button" id="sr-cancel">Hủy</button><button class="sr-btn primary" type="submit" form="sr-form">Lưu thẻ</button></footer></div></div>

<style>
  :root { --font-display:'Syne',sans-serif; --font-mono:'JetBrains Mono',monospace; }
  .dark {
    --bg-base:#0a0d14; --bg-surface:#111827; --bg-card:#1a2235; --bg-elevated:#243044;
    --border:#2a3a54; --text-primary:#e8f0fe; --text-secondary:#8b9dc3; --text-muted:#4a5a7a;
    --accent:#4f8ef7; --accent-glow:rgba(79,142,247,0.25); --accent2:#a78bfa;
    --success:#34d399; --warning:#fbbf24; --danger:#f87171;
  }
  .light {
    --bg-base:#f0f4ff; --bg-surface:#ffffff; --bg-card:#f8faff; --bg-elevated:#edf2ff;
    --border:#dde5f5; --text-primary:#0f1a35; --text-secondary:#4a5a8a; --text-muted:#8b9dc3;
    --accent:#2563eb; --accent-glow:rgba(37,99,235,0.15); --accent2:#7c3aed;
    --success:#059669; --warning:#d97706; --danger:#dc2626;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg-base);color:var(--text-primary);font-family:var(--font-display);transition:background .3s,color .3s;overflow-x:hidden;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-track{background:var(--bg-base);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent);}
  .grid-bg{background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:40px 40px;background-position:-1px -1px;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes slide-in{from{transform:translateX(-100%);opacity:0}to{transform:translateX(0);opacity:1}}
  @keyframes toast-in{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
  @keyframes toast-out{from{transform:translateX(0);opacity:1}to{transform:translateX(120%);opacity:0}}
  .animate-fade{animation:fadeIn .35s ease both;}
  .animate-slide{animation:slide-in .3s ease both;}
  .animate-toast-in{animation:toast-in .4s cubic-bezier(.34,1.56,.64,1) both;}
  .animate-toast-out{animation:toast-out .3s ease both;}
  .card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;transition:all .2s;}
  .card:hover{border-color:var(--accent);transform:translateY(-1px);}
  .card-elevated{background:var(--bg-elevated);border:1px solid var(--border);border-radius:12px;}
  .btn-primary{background:var(--accent);color:#fff;border:none;padding:8px 18px;border-radius:8px;font-family:var(--font-display);font-weight:600;cursor:pointer;transition:all .2s;font-size:14px;}
  .btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 4px 12px var(--accent-glow);}
  .btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border);padding:8px 18px;border-radius:8px;font-family:var(--font-display);font-weight:600;cursor:pointer;transition:all .2s;font-size:14px;}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
  .tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.5px;font-family:var(--font-mono);}
  .sidebar{background:var(--bg-surface);border-right:1px solid var(--border);width:240px;flex-shrink:0;height:100vh;position:sticky;top:0;display:flex;flex-direction:column;transition:all .3s;z-index:50;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:8px;cursor:pointer;color:var(--text-secondary);font-weight:600;font-size:14px;transition:all .2s;border:1px solid transparent;}
  .nav-item:hover{background:var(--bg-elevated);color:var(--text-primary);}
  .nav-item.active{background:var(--accent-glow);color:var(--accent);border-color:var(--accent);}
  .progress-bar{height:6px;border-radius:999px;background:var(--bg-elevated);overflow:hidden;}
  .progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s cubic-bezier(.34,1.56,.64,1);}
  .pomodoro-ring{position:relative;display:flex;align-items:center;justify-content:center;}
  .ring-track{fill:none;stroke:var(--bg-elevated);stroke-width:8;}
  .ring-fill{fill:none;stroke-width:8;stroke-linecap:round;}
  .note-editor{width:100%;min-height:200px;background:var(--bg-base);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-family:var(--font-mono);font-size:13px;padding:12px;line-height:1.6;resize:vertical;outline:none;transition:border-color .2s;}
  .note-editor:focus{border-color:var(--accent);}
  .star{color:#fbbf24;font-size:12px;}
  .star-empty{color:var(--text-muted);font-size:12px;}
  .toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
  .toast{pointer-events:all;background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:10px;min-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:14px;font-weight:600;}
  .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none;}
  @media(max-width:768px){
    .sidebar{position:fixed;transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);animation:slide-in .3s ease both;}
    .sidebar-overlay{display:block;}
    .main-content{margin-left:0!important;}
  }
  .cat-0{background:rgba(79,142,247,.15);color:#4f8ef7;}
  .cat-1{background:rgba(167,139,250,.15);color:#a78bfa;}
  .cat-2{background:rgba(52,211,153,.15);color:#34d399;}
  .cat-3{background:rgba(251,191,36,.15);color:#fbbf24;}
  .cat-4{background:rgba(248,113,113,.15);color:#f87171;}
  .cat-5{background:rgba(251,146,60,.15);color:#fb923c;}
  .cat-6{background:rgba(34,211,238,.15);color:#22d3ee;}
  .cat-7{background:rgba(244,114,182,.15);color:#f472b6;}
  .cat-8{background:rgba(163,230,53,.15);color:#a3e635;}
  .cat-9{background:rgba(99,102,241,.15);color:#6366f1;}
  .cat-10{background:rgba(20,184,166,.15);color:#14b8a6;}
  .cat-11{background:rgba(245,158,11,.15);color:#f59e0b;}
  .schedule-slot{border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;transition:all .2s;}
  .schedule-slot:hover{border-color:var(--accent);}
  .schedule-slot.filled{background:var(--accent-glow);border-color:var(--accent);}
  .algo-completed .algo-name{text-decoration:line-through;opacity:.6;}
  /* Pomodoro ring transition */
  .ring-fill-animated{transition:stroke-dashoffset .6s cubic-bezier(.34,1.1,.64,1),stroke .4s;}
  /* Background indicator */
  @keyframes bgPulse{0%,100%{opacity:.5}50%{opacity:1}}
  .bg-live{animation:bgPulse 2s infinite;font-size:10px;color:var(--accent);}
</style>

const LS={
  get:(k,def)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch{return def;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
};

const fmtMs=(ms)=>{
  const totalSec=Math.max(0,Math.ceil(ms/1000));
  const m=Math.floor(totalSec/60);
  const s=totalSec%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
};

const Stars=({n,max=5})=>(
  <span>
    {Array.from({length:max},(_,i)=>(
      <span key={i} className={i<n?'star':'star-empty'}>★</span>
    ))}
  </span>
);

const DiffLabel=({stars})=>{
  const labels=['','Cơ bản','Dễ','Trung bình','Khó','Rất khó'];
  const colors=['','text-green-400','text-blue-400','text-yellow-400','text-orange-400','text-red-400'];
  return <span className={`text-xs font-bold font-mono ${colors[stars]||''}`}>{labels[stars]||''}</span>;
};

};

// ─────────────────────────────────────────────────────
//  TOAST
// ─────────────────────────────────────────────────────
const ToastContext=React.createContext(null);
const ToastProvider=({children})=>{
  const [toasts,setToasts]=React.useState([]);
  const add=React.useCallback((msg,type='info',duration=3500)=>{
    const id=Date.now()+Math.random();
    setToasts(p=>[...p,{id,msg,type,leaving:false}]);
    setTimeout(()=>{
      setToasts(p=>p.map(t=>t.id===id?{...t,leaving:true}:t));
      setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),350);
    },duration);
  },[]);
  const borders={info:'#4f8ef7',success:'#34d399',warning:'#fbbf24',error:'#f87171'};
  const icons={info:'💡',success:'✅',warning:'⏰',error:'❌'};
  return(
    <ToastContext.Provider value={add}>
      {children}
      <div className="toast-container">
        {toasts.map(t=>(
          <div key={t.id} className={`toast ${t.leaving?'animate-toast-out':'animate-toast-in'}`}
            style={{borderLeft:`3px solid ${borders[t.type]}`}}>
            <span style={{fontSize:18}}>{icons[t.type]}</span>
            <span style={{color:'var(--text-primary)',fontSize:13}}>{t.msg}</span>
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
};
const useToast=()=>React.useContext(ToastContext);

// ─────────────────────────────────────────────────────
//  POMODORO — Timestamp-based, background-capable
//
//  Kiến trúc:
//  • endTime = Date.now() + remaining  (source of truth)
//  • setInterval 500ms → chỉ để re-render UI
//  • Page Visibility API → recalibrate khi tab quay lại
//  • localStorage persist → sống sót qua reload
//  • Notification API → OS-level alert khi hết giờ
// ─────────────────────────────────────────────────────
const POMO_KEY='algomaster_pomo_v2';

const Pomodoro=({compact=false})=>{
  const toast=useToast();

  // ── Settings ──────────────────────────────────────
  const [customWork,setCustomWork]=React.useState(40);
  const [customBreak,setCustomBreak]=React.useState(5);
  const [showSettings,setShowSettings]=React.useState(false);

  // ── Core timer state ──────────────────────────────
  const [mode,setMode]=React.useState('work');
  const [running,setRunning]=React.useState(false);
  const [endTime,setEndTime]=React.useState(null);         // ms timestamp
  const [pausedRemaining,setPausedRemaining]=React.useState(null); // ms
  const [displayMs,setDisplayMs]=React.useState(40*60*1000);
  const [cycles,setCycles]=React.useState(0);
  const [restoredFromBg,setRestoredFromBg]=React.useState(false);
  const [notifPerm,setNotifPerm]=React.useState(
    typeof Notification!=='undefined'?Notification.permission:'default'
  );

  // ── Refs ──────────────────────────────────────────
  const intervalRef=React.useRef(null);
  const completionFiredRef=React.useRef(false);
  const audioCtxRef=React.useRef(null);
  // liveRef: always holds latest values for use inside effects/callbacks
  const liveRef=React.useRef({});
  liveRef.current={mode,cycles,customWork,customBreak};

  // ── Audio ─────────────────────────────────────────
  const beep=React.useCallback((freq=880,dur=0.35,delay=0)=>{
    setTimeout(()=>{
      try{
        if(!audioCtxRef.current)audioCtxRef.current=new(window.AudioContext||window.webkitAudioContext)();
        const ctx=audioCtxRef.current;
        const osc=ctx.createOscillator();
        const gain=ctx.createGain();
        osc.connect(gain);gain.connect(ctx.destination);
        osc.frequency.value=freq;osc.type='sine';
        gain.gain.setValueAtTime(0.25,ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
        osc.start();osc.stop(ctx.currentTime+dur);
      }catch(e){}
    },delay);
  },[]);

  // ── OS Notification ───────────────────────────────
  const showNotif=React.useCallback((wasWork,wMin,bMin)=>{
    if(typeof Notification==='undefined'||Notification.permission!=='granted')return;
    try{
      new Notification(
        wasWork?'🍅 Hết giờ tập trung!':'💪 Hết giờ nghỉ!',
        {body:wasWork?`Xuất sắc! Nghỉ ${bMin} phút nào.`:`Hết nghỉ! Vào ${wMin} phút học tiếp.`,
         tag:'algomaster-pomo',renotify:true}
      );
    }catch(e){}
  },[]);

  // ── Completion — reads liveRef to avoid stale closures ──
  const doCompletion=React.useCallback(()=>{
    const{mode:m,cycles:c,customWork:wMin,customBreak:bMin}=liveRef.current;
    const wasWork=m==='work';
    const nextMode=wasWork?'break':'work';
    const nextDur=(nextMode==='work'?wMin:bMin)*60*1000;
    const newCycles=wasWork?c+1:c;

    if(wasWork){beep(660,0.4);beep(880,0.3,450);}
    else{beep(440,0.4);beep(660,0.3,450);}
    showNotif(wasWork,wMin,bMin);
    toast(wasWork?'🎉 Hết giờ học! Nghỉ ngơi nhé!':'💪 Hết giờ nghỉ! Bắt đầu học!','warning',5000);

    setMode(nextMode);
    setRunning(false);
    setEndTime(null);
    setPausedRemaining(nextDur);
    setDisplayMs(nextDur);
    setCycles(newCycles);
    completionFiredRef.current=false;

    LS.set(POMO_KEY,{mode:nextMode,running:false,endTime:null,
      pausedRemaining:nextDur,customWork:wMin,customBreak:bMin,cycles:newCycles});
  },[beep,showNotif,toast]);

  // ── INIT: restore from localStorage (runs once on mount) ──
  React.useEffect(()=>{
    const saved=LS.get(POMO_KEY,{});
    const wMin=saved.customWork||40;
    const bMin=saved.customBreak||5;
    const savedMode=saved.mode||'work';
    const savedCycles=saved.cycles||0;

    setCustomWork(wMin);
    setCustomBreak(bMin);
    setMode(savedMode);
    setCycles(savedCycles);

    if(saved.running&&saved.endTime){
      const now=Date.now();
      if(saved.endTime<=now){
        // Timer expired while away — complete inline with saved values
        const wasWork=savedMode==='work';
        const nextMode=wasWork?'break':'work';
        const nextDur=(nextMode==='work'?wMin:bMin)*60*1000;
        const newCycles=wasWork?savedCycles+1:savedCycles;
        setMode(nextMode);
        setPausedRemaining(nextDur);
        setDisplayMs(nextDur);
        setCycles(newCycles);
        LS.set(POMO_KEY,{mode:nextMode,running:false,endTime:null,
          pausedRemaining:nextDur,customWork:wMin,customBreak:bMin,cycles:newCycles});
        setTimeout(()=>toast('⏰ Timer đã kết thúc khi bạn vắng mặt — đã chuyển chế độ tự động','info',6000),200);
      }else{
        // Timer still live — resume seamlessly
        setEndTime(saved.endTime);
        setRunning(true);
        setDisplayMs(saved.endTime-now);
        setRestoredFromBg(true);
        setTimeout(()=>setRestoredFromBg(false),4000);
      }
    }else if(saved.pausedRemaining!=null){
      setPausedRemaining(saved.pausedRemaining);
      setDisplayMs(saved.pausedRemaining);
    }else{
      const dur=(savedMode==='work'?wMin:bMin)*60*1000;
      setDisplayMs(dur);
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);

  // ── TICK: setInterval only refreshes UI — Date.now() is truth ──
  React.useEffect(()=>{
    if(!running||endTime===null){clearInterval(intervalRef.current);return;}
    intervalRef.current=setInterval(()=>{
      const remaining=endTime-Date.now();
      if(remaining<=0&&!completionFiredRef.current){
        completionFiredRef.current=true;
        clearInterval(intervalRef.current);
        setDisplayMs(0);
        doCompletion();
      }else{
        setDisplayMs(Math.max(0,remaining));
      }
    },500);
    return()=>clearInterval(intervalRef.current);
  },[running,endTime,doCompletion]);

  // ── PAGE VISIBILITY: recalibrate when tab regains focus ──
  React.useEffect(()=>{
    const handler=()=>{
      if(document.visibilityState!=='visible')return;
      if(!running||endTime===null)return;
      const remaining=endTime-Date.now();
      if(remaining<=0&&!completionFiredRef.current){
        completionFiredRef.current=true;
        clearInterval(intervalRef.current);
        doCompletion();
      }else{
        setDisplayMs(Math.max(0,remaining));
      }
    };
    document.addEventListener('visibilitychange',handler);
    return()=>document.removeEventListener('visibilitychange',handler);
  },[running,endTime,doCompletion]);

  // ── PERSIST whenever state changes ────────────────
  React.useEffect(()=>{
    LS.set(POMO_KEY,{mode,running,endTime,pausedRemaining,customWork,customBreak,cycles});
  },[mode,running,endTime,pausedRemaining,customWork,customBreak,cycles]);

  // ── PLAY ──────────────────────────────────────────
  const play=React.useCallback(()=>{
    const remaining=pausedRemaining!==null
      ?pausedRemaining
      :(mode==='work'?customWork:customBreak)*60*1000;
    completionFiredRef.current=false;
    setEndTime(Date.now()+remaining);
    setPausedRemaining(null);
    setRunning(true);
  },[pausedRemaining,mode,customWork,customBreak]);

  // ── PAUSE ─────────────────────────────────────────
  const pause=React.useCallback(()=>{
    const remaining=endTime?Math.max(0,endTime-Date.now()):displayMs;
    clearInterval(intervalRef.current);
    setRunning(false);
    setEndTime(null);
    setPausedRemaining(remaining);
    setDisplayMs(remaining);
  },[endTime,displayMs]);

  // ── RESET ─────────────────────────────────────────
  const reset=React.useCallback(()=>{
    clearInterval(intervalRef.current);
    completionFiredRef.current=false;
    const dur=(mode==='work'?customWork:customBreak)*60*1000;
    setRunning(false);setEndTime(null);setPausedRemaining(null);setDisplayMs(dur);
  },[mode,customWork,customBreak]);

  // ── SKIP ──────────────────────────────────────────
  const skip=React.useCallback(()=>{
    clearInterval(intervalRef.current);
    completionFiredRef.current=false;
    const nextMode=mode==='work'?'break':'work';
    const dur=(nextMode==='work'?customWork:customBreak)*60*1000;
    setMode(nextMode);setRunning(false);setEndTime(null);setPausedRemaining(null);setDisplayMs(dur);
  },[mode,customWork,customBreak]);

  // ── SWITCH MODE manually ──────────────────────────
  const switchMode=React.useCallback((m)=>{
    if(mode===m)return;
    clearInterval(intervalRef.current);
    completionFiredRef.current=false;
    const dur=(m==='work'?customWork:customBreak)*60*1000;
    setMode(m);setRunning(false);setEndTime(null);setPausedRemaining(null);setDisplayMs(dur);
  },[mode,customWork,customBreak]);

  // ── Request OS notification permission ────────────
  const requestNotif=React.useCallback(async()=>{
    if(typeof Notification==='undefined')return;
    const perm=await Notification.requestPermission();
    setNotifPerm(perm);
    if(perm==='granted')toast('🔔 Thông báo OS đã được bật!','success');
    else if(perm==='denied')toast('❌ Thông báo bị chặn. Vào Settings browser để bật lại.','error',5000);
  },[toast]);

  // ── Derived values ────────────────────────────────
  const totalMs=(mode==='work'?customWork:customBreak)*60*1000;
  const progress=Math.max(0,Math.min(1,1-displayMs/totalMs));
  const strokeColor=mode==='work'?'#4f8ef7':'#34d399';

  // ── COMPACT (sidebar) ─────────────────────────────
  if(compact){
    const r=50,circ=2*Math.PI*r,offset=circ*(1-progress);
    return(
      <div className="flex items-center gap-3 px-4 py-2 card-elevated rounded-xl">
        <div className="pomodoro-ring" style={{width:44,height:44}}>
          <svg width="44" height="44" viewBox="0 0 120 120" style={{transform:'rotate(-90deg)'}}>
            <circle cx="60" cy="60" r={r} className="ring-track"/>
            <circle cx="60" cy="60" r={r} className="ring-fill ring-fill-animated"
              stroke={strokeColor} strokeDasharray={circ} strokeDashoffset={offset}/>
          </svg>
          <div style={{position:'absolute',display:'flex',alignItems:'center',justifyContent:'center',inset:0}}>
            <span style={{fontSize:9,fontFamily:'var(--font-mono)',color:'var(--text-primary)',fontWeight:700}}>{fmtMs(displayMs)}</span>
          </div>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:11,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:1,display:'flex',alignItems:'center',gap:4}}>
            {mode==='work'?'Học tập':'Nghỉ'}
            {running&&<span className="bg-live">●</span>}
            {restoredFromBg&&<span style={{color:'var(--accent)',fontSize:9}}>↻BG</span>}
          </div>
          <div style={{fontSize:13,fontWeight:700,color:'var(--text-primary)',fontFamily:'var(--font-mono)'}}>{fmtMs(displayMs)}</div>
        </div>
        <button onClick={()=>running?pause():play()} className="btn-primary" style={{padding:'6px 12px',fontSize:12}}>
          {running?'⏸':'▶'}
        </button>
      </div>
    );
  }

  // ── FULL ──────────────────────────────────────────
  const r=88,circ=2*Math.PI*r,offset=circ*(1-progress);
  const notifLabel=notifPerm==='granted'?'✅ Thông báo OS: đã bật'
    :notifPerm==='denied'?'❌ Thông báo bị chặn trong browser'
    :'🔔 Bật thông báo OS khi hết giờ';

  return(
    <div className="card p-6 animate-fade">
      {/* Header */}
      <div className="flex items-center justify-between mb-4">
        <h2 style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:22,color:'var(--text-primary)',display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
          🍅 Pomodoro
          {running&&<span style={{fontSize:10,background:'rgba(79,142,247,.15)',color:'var(--accent)',padding:'2px 8px',borderRadius:99,fontWeight:600}}>
            ● ĐANG CHẠY
          </span>}
          {restoredFromBg&&<span style={{fontSize:10,background:'rgba(52,211,153,.15)',color:'var(--success)',padding:'2px 8px',borderRadius:99,fontWeight:600}}>
            ↻ Khôi phục từ background
          </span>}
        </h2>
        <button onClick={()=>setShowSettings(s=>!s)} className="btn-ghost" style={{padding:'6px 10px'}}>
          <Icon name="settings" size={14}/>
        </button>
      </div>

      {/* Settings panel */}
      {showSettings&&(
        <div className="card-elevated p-4 mb-4 animate-fade">
          <div className="grid grid-cols-2 gap-4 mb-3">
            <div>
              <label style={{fontSize:12,color:'var(--text-muted)',display:'block',marginBottom:4}}>Học (phút)</label>
              <input type="number" min={1} max={120} value={customWork}
                onChange={e=>{
                  const v=Math.max(1,Math.min(120,+e.target.value));
                  setCustomWork(v);
                  if(!running&&pausedRemaining===null&&mode==='work')setDisplayMs(v*60*1000);
                }}
                style={{width:'100%',background:'var(--bg-base)',border:'1px solid var(--border)',borderRadius:6,padding:'6px 10px',color:'var(--text-primary)',fontFamily:'var(--font-mono)',fontSize:14}}/>
            </div>
            <div>
              <label style={{fontSize:12,color:'var(--text-muted)',display:'block',marginBottom:4}}>Nghỉ (phút)</label>
              <input type="number" min={1} max={60} value={customBreak}
                onChange={e=>{
                  const v=Math.max(1,Math.min(60,+e.target.value));
                  setCustomBreak(v);
                  if(!running&&pausedRemaining===null&&mode==='break')setDisplayMs(v*60*1000);
                }}
                style={{width:'100%',background:'var(--bg-base)',border:'1px solid var(--border)',borderRadius:6,padding:'6px 10px',color:'var(--text-primary)',fontFamily:'var(--font-mono)',fontSize:14}}/>
            </div>
          </div>
          {/* Notification row */}
          <div style={{borderTop:'1px solid var(--border)',paddingTop:10,display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,flexWrap:'wrap'}}>
            <span style={{fontSize:12,color:notifPerm==='granted'?'var(--success)':notifPerm==='denied'?'var(--danger)':'var(--text-muted)'}}>
              {notifLabel}
            </span>
            {notifPerm==='default'&&(
              <button onClick={requestNotif} className="btn-primary" style={{padding:'5px 10px',fontSize:11}}>
                Cấp quyền
              </button>
            )}
          </div>
        </div>
      )}

      {/* Mode tabs */}
      <div style={{display:'flex',gap:0,marginBottom:20,background:'var(--bg-elevated)',borderRadius:10,padding:3,border:'1px solid var(--border)'}}>
        {[['work','🧠 Tập trung'],['break','☕ Nghỉ ngơi']].map(([m,label])=>(
          <button key={m} onClick={()=>switchMode(m)}
            style={{flex:1,padding:'8px 0',borderRadius:7,border:'none',fontFamily:'var(--font-display)',fontWeight:700,fontSize:13,cursor:'pointer',transition:'all .2s',
              background:mode===m?(m==='work'?'var(--accent)':'var(--success)'):'transparent',
              color:mode===m?'#fff':'var(--text-secondary)'}}>
            {label}
          </button>
        ))}
      </div>

      {/* Ring */}
      <div className="flex flex-col items-center mb-6">
        <div className="pomodoro-ring" style={{width:200,height:200}}>
          <svg width="200" height="200" viewBox="0 0 200 200" style={{transform:'rotate(-90deg)'}}>
            <circle cx="100" cy="100" r={r} className="ring-track" strokeWidth="10"/>
            <circle cx="100" cy="100" r={r} className="ring-fill ring-fill-animated"
              stroke={strokeColor} strokeWidth="10"
              strokeDasharray={circ} strokeDashoffset={offset}
              style={{filter:`drop-shadow(0 0 6px ${strokeColor}50)`}}/>
          </svg>
          <div style={{position:'absolute',textAlign:'center'}}>
            <div style={{fontSize:38,fontFamily:'var(--font-mono)',fontWeight:700,color:'var(--text-primary)',lineHeight:1}}>{fmtMs(displayMs)}</div>
            <div style={{fontSize:11,color:strokeColor,fontWeight:700,marginTop:6,letterSpacing:1}}>
              {running?(mode==='work'?'TẬP TRUNG':'NGHỈ NGƠI'):(displayMs===0?'XONG ✓':'SẴN SÀNG')}
            </div>
            {running&&<div style={{fontSize:9,color:'var(--text-muted)',marginTop:4}}>đang chạy ngầm ●</div>}
          </div>
        </div>
      </div>

      {/* Controls */}
      <div className="flex gap-3 justify-center mb-4">
        <button onClick={reset} className="btn-ghost" style={{padding:'8px 14px'}} title="Đặt lại">
          <Icon name="rotate-ccw" size={16}/>
        </button>
        <button onClick={()=>running?pause():play()} className="btn-primary"
          style={{padding:'10px 28px',fontSize:16,minWidth:120,display:'flex',alignItems:'center',gap:8,justifyContent:'center',
            background:mode==='work'?'var(--accent)':'var(--success)'}}>
          <Icon name={running?'pause':'play'} size={18}/>
          {running?'Tạm dừng':'Bắt đầu'}
        </button>
        <button onClick={skip} className="btn-ghost" style={{padding:'8px 14px'}} title="Bỏ qua">
          <Icon name="skip-forward" size={16}/>
        </button>
      </div>

      <div className="text-center" style={{fontSize:13,color:'var(--text-muted)'}}>
        <Icon name="award" size={13} className="inline mr-1"/>
        Đã hoàn thành <strong style={{color:'var(--accent)'}}>{cycles}</strong> chu kỳ hôm nay
      </div>
    </div>
  );
};

const AlgoModal=({algo,onClose,notes,setNotes,completed,onToggleComplete})=>{
  const toast=useToast();
  const note=notes[algo.id]||'';
  const [draft,setDraft]=React.useState(note);
  const [saved,setSaved]=React.useState(true);
  const save=()=>{
    const updated={...notes,[algo.id]:draft};
    setNotes(updated);LS.set('algo_notes',updated);setSaved(true);
    toast('📝 Ghi chú đã được lưu!','success',2000);
  };
  const clear=()=>{
    if(!window.confirm('Xóa ghi chú này?'))return;
    const updated={...notes};delete updated[algo.id];
    setNotes(updated);LS.set('algo_notes',updated);setDraft('');
    toast('🗑️ Đã xóa ghi chú','info',2000);
  };
  React.useEffect(()=>{setSaved(draft===note);},[draft,note]);
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.7)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="card animate-fade" style={{width:'100%',maxWidth:640,maxHeight:'90vh',overflowY:'auto',padding:28}}>
        <div className="flex items-start justify-between mb-4 gap-3">
          <div style={{flex:1}}>
            <div className="flex items-center gap-2 mb-2 flex-wrap">
              <span className={`tag ${CAT_COLORS[algo.category]||'cat-0'}`}>{algo.category}</span>
              <Stars n={algo.stars}/><DiffLabel stars={algo.stars}/>
            </div>
            <h2 style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:20,color:'var(--text-primary)',lineHeight:1.3}}>{algo.name}</h2>
          </div>
          <button onClick={onClose} className="btn-ghost" style={{padding:'6px 10px',flexShrink:0}}><Icon name="x" size={16}/></button>
        </div>
        <div className="card-elevated p-3 mb-4 flex items-center gap-2">
          <Icon name="book-open" size={15} className="text-blue-400"/>
          <span style={{fontSize:13,color:'var(--text-muted)',flex:1}}>Tài liệu VNOI Wiki</span>
          <a href={algo.link} target="_blank" rel="noopener noreferrer" className="btn-primary"
            style={{padding:'5px 12px',fontSize:12,display:'flex',alignItems:'center',gap:5}}>
            <Icon name="external-link" size={12}/> Xem bài
          </a>
        </div>
        <div className="flex items-center gap-3 mb-5">
          <button onClick={()=>{onToggleComplete(algo.id);toast(completed[algo.id]?'↩️ Đã bỏ đánh dấu':'✅ Đã hoàn thành!',completed[algo.id]?'info':'success');}}
            className={completed[algo.id]?'btn-primary':'btn-ghost'}
            style={{display:'flex',alignItems:'center',gap:6}}>
            <Icon name="check-circle" size={15}/>
            {completed[algo.id]?'Đã học xong':'Đánh dấu hoàn thành'}
          </button>
          {completed[algo.id]&&<span style={{fontSize:12,color:'var(--success)'}}>✓ Bạn đã học thuật toán này</span>}
        </div>
        <div className="mb-3 flex items-center justify-between">
          <h3 style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:15,color:'var(--text-primary)'}}>📝 Ghi chú cá nhân</h3>
          <div style={{fontSize:11,color:saved?'var(--success)':'var(--warning)'}}>{saved?'● Đã lưu':'● Chưa lưu'}</div>
        </div>
        <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:6}}>Hỗ trợ text thuần. Code: ``` code ```</div>
        <textarea className="note-editor" value={draft} onChange={e=>setDraft(e.target.value)}
          placeholder={`// Ghi chú về ${algo.name}\n// Ý tưởng chính:\n// Độ phức tạp:\n// Ví dụ:`} rows={8}/>
        <div className="flex gap-2 mt-3">
          <button onClick={save} className="btn-primary" style={{display:'flex',alignItems:'center',gap:5}}>
            <Icon name="save" size={14}/> Lưu
          </button>
          {draft&&<button onClick={clear} className="btn-ghost" style={{display:'flex',alignItems:'center',gap:5,color:'var(--danger)'}}>
            <Icon name="trash" size={14}/> Xóa
          </button>}
        </div>
        {draft&&(
          <div className="mt-4">
            <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:6,fontWeight:700}}>PREVIEW:</div>
            <div className="card-elevated p-3" style={{fontSize:13,color:'var(--text-secondary)',lineHeight:1.7,fontFamily:'var(--font-mono)',whiteSpace:'pre-wrap',wordBreak:'break-word'}}>
              {draft}
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

// ─────────────────────────────────────────────────────
