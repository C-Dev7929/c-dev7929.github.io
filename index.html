<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Repo Explorer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 20px;
    }

    h1 {
      color: #38bdf8;
    }

    ul {
      list-style: none;
      padding-left: 20px;
    }

    li {
      margin: 4px 0;
      cursor: pointer;
    }

    .folder {
      color: #facc15;
    }

    .file {
      color: #22c55e;
    }
  </style>
</head>
<body>

<h1>📁 Repo Explorer</h1>
<p id="status">Đang tải...</p>
<ul id="tree"></ul>

<script>
  const owner = "c-dev7929";  
  const repo = "c-dev7929.github.io";        

  const treeEl = document.getElementById("tree");
  const statusEl = document.getElementById("status");

  async function fetchContents(path = "") {
    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
    const res = await fetch(url);
    return await res.json();
  }

  async function renderTree(container, path = "") {
    const items = await fetchContents(path);

    for (const item of items) {
      const li = document.createElement("li");
      li.textContent = item.name;

      if (item.type === "dir") {
        li.classList.add("folder");

        const subUl = document.createElement("ul");
        subUl.style.display = "none";

        li.onclick = async (e) => {
          e.stopPropagation();
          if (subUl.childElementCount === 0) {
            await renderTree(subUl, item.path);
          }
          subUl.style.display = subUl.style.display === "none" ? "block" : "none";
        };

        container.appendChild(li);
        container.appendChild(subUl);
      } else {
        li.classList.add("file");
        li.onclick = (e) => {
          e.stopPropagation();
          window.open(item.html_url, "_blank");
        };
        container.appendChild(li);
      }
    }
  }

  async function init() {
    try {
      await renderTree(treeEl);
      statusEl.textContent = "✔️ Hoàn tất";
    } catch (err) {
      statusEl.textContent = "❌ Lỗi khi tải repo";
      console.error(err);
    }
  }

  init();
</script>

</body>
</html>
